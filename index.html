<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invest-Zentrale</title>
<style>
:root{--bg:#0f1218;--panel:#171b24;--card:#1b202b;--line:#2a3140;--tx:#e6e9ef;--mut:#9aa3b5;--acc:#6ea8fe;--ok:#4fd1a5;--warn:#f2b84b;--bad:#f87171}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f8;--panel:#ffffff;--card:#ffffff;--line:#d9dde6;--tx:#1b2030;--mut:#5b6478;--acc:#2a5db0;--ok:#127a5a;--warn:#9a6500;--bad:#b42323}}
:root[data-theme=dark]{--bg:#0f1218;--panel:#171b24;--card:#1b202b;--line:#2a3140;--tx:#e6e9ef;--mut:#9aa3b5;--acc:#6ea8fe;--ok:#4fd1a5;--warn:#f2b84b;--bad:#f87171}
:root[data-theme=light]{--bg:#f4f5f8;--panel:#ffffff;--card:#ffffff;--line:#d9dde6;--tx:#1b2030;--mut:#5b6478;--acc:#2a5db0;--ok:#127a5a;--warn:#9a6500;--bad:#b42323}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
a{color:var(--acc)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--mut);margin-left:8px;font-size:12px}
.sp{flex:1}
button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#burger{display:none}
.wrap{flex:1;display:flex;min-height:0}
nav{width:230px;flex:none;border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto}
nav h4{margin:14px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
nav h4:first-child{margin-top:2px}
nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--tx);text-decoration:none}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--bg);box-shadow:inset 3px 0 0 var(--acc);font-weight:600}
nav a small{color:var(--mut);margin-left:6px}
nav .foot{margin:18px 8px 0;color:var(--mut);font-size:12px}
main{flex:1;overflow:auto;padding:22px clamp(14px,3vw,36px) 60px;min-width:0}
.page{max-width:1200px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px;line-height:1.2}
h2{font-size:19px;margin:28px 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--mut);margin-right:6px;background:var(--card)}
.chip.t{color:var(--acc);border-color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 2px;font-size:17px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--bg)}
.kpi b{display:block;font-size:14px}
.kpi span{color:var(--mut);font-size:11px}
.next{color:var(--mut);font-size:13px;margin:8px 0 12px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);background:var(--panel)}
td.num{text-align:right}
tr.past td{opacity:.5}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0 18px;flex-wrap:wrap}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--tx);border-color:var(--acc);font-weight:600}
.report{display:flex;gap:28px;align-items:flex-start}
.report .doc{flex:1;min-width:0;max-width:880px}
.report .toc{width:210px;flex:none;position:sticky;top:0;font-size:13px}
.report .toc a{display:block;padding:3px 0;color:var(--mut);text-decoration:none}
.report .toc a:hover{color:var(--acc)}
.doc h1{display:none}
.doc h2{border-bottom:1px solid var(--line);padding-bottom:4px}
.doc ul{padding-left:22px}
.doc code{background:var(--panel);padding:1px 5px;border-radius:4px}
.doc pre{background:var(--panel);padding:12px;border-radius:8px;overflow:auto}
.frame{width:100%;height:max(680px,90vh);min-height:520px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.note{border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--card);padding:10px 14px;border-radius:8px;margin:14px 0;color:var(--mut)}
.alert{border-left-color:var(--bad);color:var(--tx)}
form.j{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
form.j label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
form.j .wide{grid-column:1/-1}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.w{color:var(--warn);border-color:var(--warn)}
.big{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--acc);border-radius:12px;background:var(--card);padding:14px 18px;margin:0 0 18px}
.big b{font-size:16px}.big .sp{flex:1;min-width:120px}
tr.mon td{background:var(--panel);font-weight:600;color:var(--mut);text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.erg{display:block;color:var(--ok);font-size:13px;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}.bar select{width:auto}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.good{color:var(--ok)}.badc{color:var(--bad)}
@media (max-width:900px){
 #burger{display:inline-block}
 nav{position:fixed;z-index:5;top:49px;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s}
 nav.open{transform:none;box-shadow:0 0 30px #0008}
 .report{flex-direction:column}.report .toc{display:none}
 .frame{height:70vh}
}
</style>
</head>
<body>
<div class="top">
  <button id="burger" aria-label="Menü">☰</button>
  <div class="brand">Invest-Zentrale<small>Keine Anlageberatung</small></div>
  <div class="sp"></div>
  <button id="theme" title="Darstellung wechseln">Darstellung: automatisch</button>
</div>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"><div class="page" id="view"></div></main>
</div>
<script>
const SITE = {"firmen": [{"ticker": "BLK", "name": "BlackRock, Inc.", "boerse": "NYSE", "typ": "Langfrist-Kandidat", "stand": "2026-10-25", "ordner": "BLK-BlackRock", "kennzahlen": [{"k": "Kurs (Eröffnung Fr. 23.10.)", "v": "1’137 USD", "hinweis": "Quelle MarketBeat; aktueller Schlusskurs nicht geprüft"}, {"k": "AUM 30.09.2026", "v": "15,49 Bio. USD"}, {"k": "EPS Q3 (bereinigt)", "v": "15,93 USD", "hinweis": "Konsens ca. 14,3 USD; GAAP 10,57 USD"}, {"k": "Umsatz Q3", "v": "7,75 Mrd. USD", "hinweis": "Konsens ca. 7,4 Mrd. USD"}, {"k": "Dividende", "v": "5,73 USD / Quartal"}, {"k": "KGV", "v": "20,7", "hinweis": "MarketBeat"}, {"k": "Analysten", "v": "Moderate Buy", "hinweis": "Ø Kursziel ca. 1’337 USD (MarketBeat 23.10.)"}], "termine": [{"s": "2026-10-14", "d": "14.10.2026", "art": "Quartal", "status": "bestätigt", "t": "Q3-2026-Zahlen veröffentlicht.", "ergebnis": "Bereinigter Gewinn je Aktie 15,93 USD (Konsens ca. 14,32), Umsatz 7,75 Mrd. USD (Konsens ca. 7,4)."}, {"s": "2026-11-07", "d": "Nov 2026 (erwartet)", "art": "Dividende", "status": "erwartet", "t": "Dividendenerklärung Q4. Vorjahr: 7.11.2025 (5,21 USD). Nicht bestätigt."}, {"s": "2027-01-15", "d": "Mitte Jan 2027 (erwartet)", "art": "Jahr", "status": "erwartet", "t": "Q4- und Jahreszahlen 2026. Vorjahr 15. Januar. Termin noch nicht angekündigt."}, {"s": "2027-05-19", "d": "Mai 2027 (erwartet)", "art": "HV", "status": "erwartet", "t": "Hauptversammlung. 2026 war am 19.05."}], "bericht_html": "<h1 id=\"blackrock-inc-blk-nyse-dossier\">BlackRock, Inc. (BLK, NYSE): Dossier<\/h1>\n<p>Stand: 25.10.2026. Keine Anlageberatung. Verlässlichkeit: <strong>belegt<\/strong> (Firma, SEC), <strong>berichtet<\/strong> (Medien, Datenseiten), <strong>vermutet<\/strong> (Einordnung ohne Quelle). Die Mindmap <code>mindmap.html<\/code> zeigt die Verbindungen dazu.<\/p>\n<h2 id=\"0-auf-einen-blick\">0. Auf einen Blick<\/h2>\n<ul>\n<li>Weltgrösster Vermögensverwalter: 15,49 Bio. USD verwaltetes Vermögen (30.09.2026), Q3-Nettozuflüsse 205 Mrd. USD.<\/li>\n<li>Q3 2026 (14.10.): Umsatz und bereinigter Gewinn je Aktie schlugen den Konsens klar (15,93 gegen ca. 14,3 USD).<\/li>\n<li>Wachstumsgeschichte: private Märkte (HPS, GIP) und KI-Infrastruktur (Aligned, 40 Mrd. USD), dazu die Software Aladdin.<\/li>\n<li>Grösster Schwachpunkt zurzeit: Private Credit. Im März 2026 begrenzte BlackRock Abhebungen bei einem HPS-Fonds.<\/li>\n<li>Nächste Auslöser: Dividendenerklärung (erwartet Nov), Q4-Zahlen (erwartet Mitte Jan 2027).<\/li>\n<\/ul>\n<h2 id=\"1-geschaftsmodell\">1. Geschäftsmodell<\/h2>\n<p>BlackRock verdient vor allem Gebühren, die an das verwaltete Vermögen gekoppelt sind. Steigen Märkte oder kommen Zuflüsse, wachsen die Einnahmen; fallen die Märkte, sinken sie (Einordnung, <strong>vermutet<\/strong>).<\/p>\n<table>\n<thead>\n<tr>\n<th>Bereich<\/th>\n<th>Grösse<\/th>\n<th>Quelle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>iShares ETFs<\/td>\n<td>5,47 Bio. USD AUM (Dez 2025), 527 Mrd. USD Zufluss 2025<\/td>\n<td>10-K<\/td>\n<\/tr>\n<tr>\n<td>Institutionell langfristig<\/td>\n<td>6,21 Bio. USD (aktiv 2,52 / Index 3,70)<\/td>\n<td>10-K<\/td>\n<\/tr>\n<tr>\n<td>Privatkunden langfristig<\/td>\n<td>1,28 Bio. USD<\/td>\n<td>10-K<\/td>\n<\/tr>\n<tr>\n<td>Private Märkte<\/td>\n<td>322,6 Mrd. USD (Private Credit 145,4 / Infrastruktur 112,1)<\/td>\n<td>10-K<\/td>\n<\/tr>\n<tr>\n<td>Cash-Management<\/td>\n<td>1,08 Bio. USD<\/td>\n<td>10-K<\/td>\n<\/tr>\n<tr>\n<td>Digitale Assets<\/td>\n<td>78,4 Mrd. USD<\/td>\n<td>10-K<\/td>\n<\/tr>\n<tr>\n<td>Technologie (Aladdin, eFront, Preqin, Cachematrix)<\/td>\n<td>2,0 Mrd. USD Umsatz 2025 (+24 %)<\/td>\n<td>10-K<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Kunden: Pensionskassen 3,9 Bio. USD (62 % des institutionellen Langfrist-Vermögens), Versicherer 720 Mrd., staatliche Institutionen 348 Mrd. Regionen: Amerika 68 %, EMEA 25 %, Asien-Pazifik 7 %. Kein einzelner Grosskunde wird als Konzentrationsrisiko genannt (nur grosse Einzelabflüsse bei Index- und Asien-Mandaten).<\/p>\n<h2 id=\"2-aktuelle-zahlen-q3-2026-veroffentlichung-14102026\">2. Aktuelle Zahlen (Q3 2026, Veröffentlichung 14.10.2026)<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Q3 2026<\/th>\n<th>Q3 2025<\/th>\n<th>Konsens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Umsatz<\/td>\n<td>7,752 Mrd. USD (+19 %)<\/td>\n<td>6,509 Mrd.<\/td>\n<td>ca. 7,42 Mrd.<\/td>\n<\/tr>\n<tr>\n<td>Gewinn je Aktie bereinigt<\/td>\n<td><strong>15,93 USD<\/strong> (+38 %)<\/td>\n<td>11,55<\/td>\n<td>ca. 14,32<\/td>\n<\/tr>\n<tr>\n<td>Gewinn je Aktie GAAP<\/td>\n<td>10,57 USD (+25 %)<\/td>\n<td>8,43<\/td>\n<td>nicht verglichen<\/td>\n<\/tr>\n<tr>\n<td>Operatives Ergebnis bereinigt<\/td>\n<td>3,330 Mrd. USD (+27 %)<\/td>\n<td>2,621<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Marge bereinigt<\/td>\n<td>47,8 %<\/td>\n<td>44,6 %<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>AUM<\/td>\n<td>15,488 Bio. USD (+15 %)<\/td>\n<td>13,464 Bio.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Nettozuflüsse<\/td>\n<td>205,5 Mrd. USD<\/td>\n<td>204,6 Mrd.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Davon ETFs / aktiv / private Märkte<\/td>\n<td>134,5 / 66,4 / 15,3 Mrd.<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Technologie-Umsatz<\/td>\n<td>588 Mio. USD (+14 %)<\/td>\n<td>515 Mio.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dividende je Quartal<\/td>\n<td>5,73 USD<\/td>\n<td>5,21<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rückkäufe im Quartal<\/td>\n<td>550 Mio. USD<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Quellen: Q3-Mitteilung der Firma (belegt), Konsens aus MarketBeat (berichtet).<\/p>\n<p><strong>Wichtige Falle:<\/strong> Eine Datenseite (MarketScreener) stellt den GAAP-Gewinn von 10,6 USD einem Konsens von 14,7 USD gegenüber und zeigt «Miss» (-28 %). Das ist ein Vergleich verschiedener Grössen. Der Markt vergleicht den <strong>bereinigten<\/strong> Gewinn (15,93 gegen ca. 14,3), also ein <strong>Beat<\/strong>. Der bereinigte Gewinn enthält 164 Mio. USD nicht-operative Gewinne aus Securitize und Circle.<\/p>\n<p><strong>Ausblick laut Management (Telefonkonferenz):<\/strong> Q4 saisonal am stärksten (30 bis 40 % der iShares-Jahreszuflüsse); Rückkäufe im Q4 mindestens 550 Mio. USD; organisches Basisgebühren-Wachstum 6 bis 8 % (in starken Märkten höher); Steuerquote Q4 ca. 25 %; G&amp;A im Jahr mit einem Anstieg im mittleren einstelligen Prozentbereich.<\/p>\n<h2 id=\"3-kurs-und-bewertung\">3. Kurs und Bewertung<\/h2>\n<ul>\n<li>Eröffnung Freitag 23.10.2026: 1’137 USD (MarketBeat). Schlusskurs und aktueller Kurs nicht geprüft. Grössere Aktienkurse ohne Zeitstempel (z. B. CNN-Seite mit Stand Dezember 2025) sind veraltet.<\/li>\n<li>Vortag der Zahlen: Schlusskurs 1’066,12 USD (Tradingpedia). Bis zur Eröffnung am 23.10. also rund +6,6 %.<\/li>\n<li>52-Wochen-Spanne laut MarketBeat 917,39 bis 1’187,17 USD (ein anderer Artikel nennt 1’219,94 als Hoch: <strong>Quellen widersprechen sich<\/strong>).<\/li>\n<li>50-Tage-Schnitt 1’104,55, 200-Tage-Schnitt 1’068,59 USD.<\/li>\n<li>Marktkapitalisierung ca. 176 Mrd. USD, KGV 20,7.<\/li>\n<li>Analysten: «Moderate Buy» (1 Strong Buy, 15 Buy, 2 Hold), durchschnittliches Kursziel ca. 1’337 USD (23.10.); am 14.10. noch ca. 1’310 USD.<\/li>\n<li>Kursreaktion am Berichtstag: <strong>unklar.<\/strong> Eine Quelle nennt +3,7 % vorbörslich, eine andere «-1,5 % nach den Zahlen». Der Schlusskurs ist nicht belegt.<\/li>\n<\/ul>\n<h2 id=\"4-termine\">4. Termine<\/h2>\n<table>\n<thead>\n<tr>\n<th>Datum<\/th>\n<th>Ereignis<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nov 2026<\/td>\n<td>Dividendenerklärung Q4 (Vorjahr 7.11.2025: 5,21 USD; Ex-Datum 5.12.2025)<\/td>\n<td>erwartet, nicht bestätigt<\/td>\n<\/tr>\n<tr>\n<td>Mitte Jan 2027<\/td>\n<td>Q4- und Jahreszahlen 2026 (Vorjahr: 15. Januar)<\/td>\n<td>Termin noch nicht angekündigt<\/td>\n<\/tr>\n<tr>\n<td>Mai 2027<\/td>\n<td>Hauptversammlung (2026: 19.05.)<\/td>\n<td>erwartet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Dividenden 2026: je 5,73 USD, Ex-Daten 6.3., 5.6., 8.9. (MarketScreener, IR).<\/p>\n<h2 id=\"5-eigentumer\">5. Eigentümer<\/h2>\n<table>\n<thead>\n<tr>\n<th>Halter<\/th>\n<th>Anteil<\/th>\n<th>Stand<\/th>\n<th>Verlässlichkeit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vanguard<\/td>\n<td>ca. 8,6 %<\/td>\n<td>Feb 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>State Street<\/td>\n<td>ca. 4,1 %<\/td>\n<td>Feb 2025 / Q1 2026<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>Temasek (Singapur)<\/td>\n<td>ca. 3,3 bis 3,4 %<\/td>\n<td>Feb 2025 / Q1 2026<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>Capital Research Global Investors<\/td>\n<td>ca. 3 %<\/td>\n<td>Q1 2026<\/td>\n<td>vermutet (Datenseite mit unklarem Nenner)<\/td>\n<\/tr>\n<tr>\n<td>Geode Capital<\/td>\n<td>ca. 2,1 bis 2,3 %<\/td>\n<td>Feb 2025 / Q1 2026<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>Insider zusammen (Fink 520’124 Aktien, Wagner 429’362, Kapito 210’104)<\/td>\n<td>ca. 2,8 %<\/td>\n<td>Feb 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>Institutionen insgesamt<\/td>\n<td>ca. 81 %<\/td>\n<td>2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Auffällig: Vanguard und State Street sind zugleich grosse Konkurrenten. Temasek ist Aktionär und laut Berichten auch Mitkäufer von Aligned Data Centers. Die Zahlen stammen von Drittseiten; die verbindlichen Angaben stehen im 13F bei der SEC und im Proxy Statement (noch nicht ausgewertet).<\/p>\n<h2 id=\"6-verbindungen-wer-kauft-was-von-wem\">6. Verbindungen: wer kauft was von wem<\/h2>\n<table>\n<thead>\n<tr>\n<th>BlackRock kauft<\/th>\n<th>Von / Wer<\/th>\n<th>Wert<\/th>\n<th>Datum<\/th>\n<th>Quelle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>HPS Investment Partners (Private Credit)<\/td>\n<td>Eigentümer von HPS<\/td>\n<td>ca. 12 Mrd. USD, fast ganz in Aktien; +118 Mrd. USD zahlende AUM<\/td>\n<td>abgeschlossen 01.07.2025<\/td>\n<td>10-K, Medien (belegt)<\/td>\n<\/tr>\n<tr>\n<td>Global Infrastructure Partners (GIP)<\/td>\n<td>Eigentümer von GIP<\/td>\n<td>Preis im 10-K-Auszug nicht genannt, Medien: ca. 12,5 Mrd. USD (ungeprüft); +70 Mrd. USD AUM<\/td>\n<td>Okt 2024<\/td>\n<td>10-K<\/td>\n<\/tr>\n<tr>\n<td>Preqin (Daten)<\/td>\n<td>Eigentümer von Preqin<\/td>\n<td>2,5 Mrd. GBP bar (ca. 3,2 Mrd. USD)<\/td>\n<td>Mär 2025<\/td>\n<td>10-K (belegt)<\/td>\n<\/tr>\n<tr>\n<td>ElmTree Funds<\/td>\n<td><\/td>\n<td>+3 Mrd. USD AUM, Preis nicht genannt<\/td>\n<td>Sep 2025<\/td>\n<td>10-K<\/td>\n<\/tr>\n<tr>\n<td>Kreos, SpiderRock, Aperio<\/td>\n<td><\/td>\n<td><\/td>\n<td>2023, 2024, 2021<\/td>\n<td>10-K<\/td>\n<\/tr>\n<tr>\n<td>Aligned Data Centers (über das KI-Bündnis)<\/td>\n<td>Macquarie Asset Management<\/td>\n<td>ca. 40 Mrd. USD Unternehmenswert, über 5 GW<\/td>\n<td>angekündigt 15.10.2025, laut Q3-Call abgeschlossen<\/td>\n<td>Yahoo Finance, Q3-Call<\/td>\n<\/tr>\n<tr>\n<td>Mehrheit am Kliniken-Joint-Venture (HPS)<\/td>\n<td>Humana (CenterWell)<\/td>\n<td>bestehende Beteiligung ca. 2,8 Mrd. USD<\/td>\n<td>Okt 2026<\/td>\n<td>Tradingpedia (nur eine Quelle, berichtet)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>KI-Infrastruktur:<\/strong> Das AI Infrastructure Partnership (Fink ist Vorsitzender) umfasst laut Berichten BlackRock/GIP, Microsoft, Nvidia, xAI und MGX (Abu Dhabi). Zum Käuferkreis von Aligned gehören auch Kuwait Investment Authority und Temasek. Zudem finanziert BlackRock ein Meta-Rechenzentrum in Texas (ca. 14 Mrd. USD) mit GIP-Eigenkapital und privatem HPS-Kredit.<\/p>\n<p><strong>Minderheitsbeteiligungen (10-K):<\/strong> Securitize, Circle, Viridium, Generation Life, Upvest, Avaloq, Human Interest, Clarity AI, Envestnet, Acorns, Scalable Capital, iCapital. Beträge im 10-K-Auszug nicht genannt.<\/p>\n<p><strong>Konkurrenten:<\/strong> Das 10-K nennt keine Namen. Belegt als Vergleichsfirmen in den Medien: Blackstone, Blue Owl (Private Credit). Grosse Index-Konkurrenten sind Vanguard und State Street (zugleich Aktionäre). Fidelity, JPMorgan AM und Amundi sind allgemein bekannte Wettbewerber (<strong>vermutet<\/strong>, nicht quellengeprüft).<\/p>\n<h2 id=\"7-management\">7. Management<\/h2>\n<ul>\n<li>Larry Fink: Mitgründer, CEO und Chairman (belegt durch Telefonkonferenz, Q3 2026).<\/li>\n<li>Rob Kapito: Präsident, Mitgründer (berichtet).<\/li>\n<li>Martin Small: CFO laut Quelle von 2022, aktuelle Besetzung nicht gegengeprüft (<strong>vermutet<\/strong>).<\/li>\n<li><strong>Lücke:<\/strong> Verwaltungsrat und Nachfolgeplanung nicht ausgewertet. Das Proxy-PDF war nicht lesbar, die gefundenen Nachfolge-Artikel sind alt.<\/li>\n<\/ul>\n<h2 id=\"8-chancen-und-risiken\">8. Chancen und Risiken<\/h2>\n<p><strong>Chancen<\/strong>\n- Starke Zuflüsse (870 Mrd. USD in zwölf Monaten) und neun Quartale in Folge mit organischem Basisgebühren-Wachstum von mindestens 5 %.\n- Mehr Gewinn pro Umsatz: bereinigte Marge von 44,6 % auf 47,8 %.\n- Private Märkte und KI-Infrastruktur als zusätzlicher Wachstumsmotor, Technologie-Sparte wächst zweistellig.\n- Q4 ist saisonal am stärksten für ETF-Zuflüsse.<\/p>\n<p><strong>Risiken<\/strong>\n- Private Credit: Rücknahmen beim HPS Corporate Lending Fund am 6.3.2026 begrenzt (Anträge ca. 1,2 Mrd. USD = 9,3 % des Fonds; ausgezahlt 620 Mio. USD). Dazu ein WSJ-Bericht über einen HPS-geführten Kredit von über 400 Mio. USD mit angeblich gefälschten Rechnungen. Laut Management steht noch eine Warteschlange bei Evergreen-Fonds an.\n- Zinsvolatilität am langen Ende und Kapitalknappheit (Management).\n- Regulierung (10-K): mögliche Einstufung als systemrelevant, EU-Transaktionssteuer, OECD-Mindeststeuer, EU-DORA-Aufsicht über Aladdin.\n- Marktabhängigkeit der Gebühren (<strong>vermutet<\/strong>).\n- Politik und ESG (Texas-Boykottliste 2025 verlassen; nur Überschrift gelesen).\n- Ein Teil des Q3-Gewinns kommt aus nicht-operativen Beteiligungsgewinnen (164 Mio. USD).<\/p>\n<h2 id=\"9-einordnung-langfristig\">9. Einordnung langfristig<\/h2>\n<p>Fakten zur Entscheidungshilfe, keine Empfehlung:\n- Bewertung (KGV 20,7) bei Kurs nahe dem Jahreshoch: Wie viel von den guten Zahlen ist schon im Kurs?\n- Wie stark hängst du mit einer Einzelaktie von Börsenphasen ab? Fallen die Märkte, fällt der Umsatz mit.\n- Wie schätzt du das Private-Credit-Risiko ein? Das ist der Punkt, bei dem die Aktie im März nachgab.\n- Alternative: den Konzern indirekt über breite ETFs halten (BlackRock ist in Indexfonds ohnehin enthalten) statt als Einzelposition.\n- Die BLK-Aktie ist nicht dasselbe wie ein iShares-ETF.<\/p>\n<h2 id=\"10-einordnung-kurzfristig\">10. Einordnung kurzfristig<\/h2>\n<ul>\n<li><strong>Liquidität:<\/strong> Sehr gut (Marktkapitalisierung ca. 176 Mrd. USD).<\/li>\n<li><strong>Stückgrösse:<\/strong> Eine Aktie kostet rund 1’100 USD. Bei 3000 CHF Gesamtkapital wäre schon ein Stück ein sehr grosser Teil des Kapitals. Das Klumpenrisiko ist hoch; ein Stop-Loss von 30 CHF Risiko erfordert enge Kursgrenzen.<\/li>\n<li><strong>Kosten bei Saxo (grobe Rechnung):<\/strong> Courtage ca. 1 bis 2 USD pro Seite, Stempelabgabe 0,15 % bei Kauf und Verkauf, Währungswechsel 0,25 % je Richtung. Für Kauf und Verkauf zusammen ergibt das rund 0,5 % ohne Währungswechsel und rund 1 % mit.<\/li>\n<li><strong>Auslöser:<\/strong> Die Q3-Zahlen sind durch. Mögliche Kurstreiber in den nächsten Wochen sind die Dividendenerklärung (geringe Wirkung erwartet), Nachrichten zu Private-Credit-Fonds und die Zinsentwicklung. Keiner davon ist ein sicherer Auslöser. Eine Prognose, in welche Richtung sich der Kurs bewegt, kann ich nicht seriös geben.<\/li>\n<\/ul>\n<h2 id=\"11-watchlist-trigger-warnung-bei\">11. Watchlist-Trigger (Warnung bei)<\/h2>\n<ul>\n<li>Weitere Rücknahmebegrenzungen bei HPS- oder anderen BlackRock-Privatmarkt-Fonds.<\/li>\n<li>Mehrere Quartale mit rückläufigen Nettozuflüssen oder Fall der AUM unter 14 Bio. USD.<\/li>\n<li>Kurs unter dem 200-Tage-Schnitt (ca. 1’060 bis 1’070 USD).<\/li>\n<li>Änderungen an der Konzernspitze oder neue Regulierungsschritte (Systemrelevanz).<\/li>\n<li>Q4-Zahlen: bereinigter Gewinn je Aktie gegen Konsens, Zuflüsse, Ausblick.<\/li>\n<\/ul>\n<h2 id=\"12-lucken-und-verlasslichkeit\">12. Lücken und Verlässlichkeit<\/h2>\n<ul>\n<li>Verwaltungsrat, Vergütung und Nachfolge: nicht ausgewertet.<\/li>\n<li>10-K: nur die ersten ca. 100’000 Zeichen gelesen; Risikofaktoren (Item 1A) nicht vollständig.<\/li>\n<li>Aktionärsdaten stammen von Drittseiten und sind teils von Feb 2025; verbindlich sind 13F und Proxy bei der SEC.<\/li>\n<li>Aktueller Kurs und Schlusskurs am Berichtstag: nicht belegt.<\/li>\n<li>Lieferanten im engeren Sinn (Datenanbieter, Cloud, Software) sind nicht offengelegt; BlackRock ist ein Dienstleister, kein Produktionsbetrieb.<\/li>\n<li>Preis für GIP: nicht aus Primärquelle.<\/li>\n<\/ul>\n<h2 id=\"13-quellen\">13. Quellen<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf\">BlackRock Q3-2026 Earnings Release<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.fool.com/earnings/call-transcripts/2026/10/14/blackrock-blk-q3-2026-earnings-call-transcript/\">Q3-2026 Earnings Call Transcript (Motley Fool)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/Archives/edgar/data/2012383/000119312526071966/blk-20251231.htm\">BlackRock Form 10-K FY2025 (SEC)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.marketbeat.com/instant-alerts/filing-blackrock-blk-stock-sold-by-axxcess-wealth-management-llc-2026-10-23/\">MarketBeat, 23.10.2026<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.marketbeat.com/instant-alerts/earnings-blackrock-nyse-blk-announces-earnings-results-2026-10-14/\">MarketBeat, 14.10.2026<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.tradingpedia.com/2026/10/14/blackrock-jumps-on-q3-beat-private-markets-growth/\">Tradingpedia, 14.10.2026<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.investmentnews.com/alternatives/blackrock-curbs-redemptions-at-hps-private-credit-fund-as-investors-weigh-risks/265581\">InvestmentNews: HPS-Fonds begrenzt Rücknahmen<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://finance.yahoo.com/news/blackrock-nvidia-buy-aligned-data-113817104.html\">Yahoo Finance: Aligned-Deal<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.wealthmanagement.com/alternative-investments/blackrock-buys-credit-firm-hps-12-billion-all-stock-deal\">Wealth Management: HPS-Übernahme<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://capital.com/en-int/analysis/blackrock-shareholder-who-owns-most-blk-stock\">Capital.com: Aktionäre<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.vcpscanner.com/stock/blk/institutional-holders\">VCP Scanner: 13F-Halter<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ca.marketscreener.com/quote/stock/BLACKROCK-INC-176512022/calendar/\">MarketScreener: Kalender<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ir.blackrock.com/news-and-events/press-releases/press-releases-details/2026/BlackRock-Declares-Quarterly-Dividend-of-5-73-on-Common-Stock/default.aspx\">BlackRock IR: Dividende 5,73 USD<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://thinkadvisor.com/2022/10/03/blackrock-taps-u-s-wealth-chief-as-next-cfo\">ThinkAdvisor 2022: CFO<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://news.bloomberglaw.com/esg/blackrock-escapes-texas-oil-boycott-blacklist-after-esg-retreat\">Bloomberg Law: Texas-Boykottliste<\/a><\/li>\n<\/ul>", "mindmap_html": "<!doctype html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Mindmap<\/title>\n<style>\n:root{--bg:#0f1218;--panel:#171b24;--line:#2a3140;--tx:#e6e9ef;--mut:#9aa3b5;--acc:#6ea8fe}\n@media (prefers-color-scheme: light){\n  :root{--bg:#f4f5f8;--panel:#ffffff;--line:#d9dde6;--tx:#1b2030;--mut:#5b6478;--acc:#2a5db0}\n}\n:root  (MarketBeat)"}], "termine": [{"s": "2026-08-20", "d": "20.08.2026", "art": "Quartal", "status": "bestätigt", "t": "Q2-Zahlen (Geschäftsjahr 2027) veröffentlicht.", "ergebnis": "Bereinigter Gewinn je Aktie 0,81 USD (Konsens ca. 0,74), Umsatz 187,9 Mrd. USD (+5,9 %)."}, {"s": "2026-11-19", "d": "19.11.2026, 07:00", "art": "Quartal", "status": "laut Datenseite", "t": "Q3-Zahlen (Geschäftsjahr 2027). Laut MarketScreener; Zeitzone nicht angegeben, vermutlich US-Ostküste (in der Schweiz ca. 13:00). Prognose Q3: bereinigter Gewinn je Aktie 0,62 bis 0,64 USD."}, {"s": "2026-12-11", "d": "11.12.2026", "art": "Dividende", "status": "laut Datenseite", "t": "Ex-Dividenden-Tag, 0,2475 USD je Aktie (MarketScreener). Zahltag nicht angegeben."}, {"s": "2027-02-18", "d": "18.02.2027, 07:00", "art": "Jahr", "status": "laut Datenseite", "t": "Q4- und Jahreszahlen Geschäftsjahr 2027 (MarketScreener, unbestätigt)."}, {"s": "2027-06-04", "d": "Juni 2027 (erwartet)", "art": "HV", "status": "erwartet", "t": "Hauptversammlung. 2026 war am 04.06."}], "bericht_html": "<h1 id=\"walmart-inc-wmt-nasdaq-dossier\">Walmart Inc. (WMT, Nasdaq): Dossier<\/h1>\n<p>Stand: 25.10.2026. Keine Anlageberatung. Verlässlichkeit: <strong>belegt<\/strong> (Firma, SEC), <strong>berichtet<\/strong> (Medien, Datenseiten), <strong>vermutet<\/strong> (Einordnung ohne Quelle). Die Mindmap zeigt die Verbindungen dazu.<\/p>\n<h2 id=\"0-auf-einen-blick\">0. Auf einen Blick<\/h2>\n<ul>\n<li>Grösster Einzelhändler der Welt: 713,2 Mrd. USD Gesamtumsatz im Geschäftsjahr bis 31.01.2026, über 10’900 Läden, rund 280 Mio. Kunden pro Woche.<\/li>\n<li>Q2 (Bericht 20.08.2026): Gewinn und Umsatz über dem Konsens, Jahresprognose angehoben. Trotzdem fiel die Aktie am Berichtstag um 9,2 %.<\/li>\n<li>Im Oktober stieg die Aktie um rund 16,6 % (bester Monat seit 1999) ohne neue Firmennachricht, laut Medien wegen Rotation aus KI-Werten in defensive Titel.<\/li>\n<li>Die Waltons halten rund 44,6 %. Grösster Einzelaktionär ist also die Familie, nicht ein Fonds.<\/li>\n<li>Nächster Auslöser: <strong>Q3-Zahlen am 19.11.2026<\/strong> (laut MarketScreener, 07:00, vermutlich US-Ostküste).<\/li>\n<\/ul>\n<h2 id=\"1-geschaftsmodell\">1. Geschäftsmodell<\/h2>\n<p>Walmart verkauft Waren des täglichen Bedarfs zu tiefen Preisen und verdient zunehmend an Onlinehandel, Werbung und Mitgliedschaften.<\/p>\n<table>\n<thead>\n<tr>\n<th>Bereich<\/th>\n<th>Nettoumsatz GJ 2026<\/th>\n<th>Anteil<\/th>\n<th>Läden<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Walmart U.S.<\/td>\n<td>483,0 Mrd. USD<\/td>\n<td>68 %<\/td>\n<td>4’611<\/td>\n<\/tr>\n<tr>\n<td>Walmart International<\/td>\n<td>130,4 Mrd. USD<\/td>\n<td>19 %<\/td>\n<td>5’743 in 18 Ländern<\/td>\n<\/tr>\n<tr>\n<td>Sam’s Club U.S.<\/td>\n<td>93,0 Mrd. USD<\/td>\n<td>13 %<\/td>\n<td>601 Clubs<\/td>\n<\/tr>\n<tr>\n<td><strong>Summe Nettoumsatz<\/strong><\/td>\n<td><strong>706,4 Mrd. USD<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Quelle: 10-K (belegt). Rund 2,1 Mio. Mitarbeitende, davon 1,6 Mio. in den USA. Abholung oder Lieferung an über 8’400 Standorten.<\/p>\n<p>Wachstumsfelder im Q2 (belegt, Firmenmitteilung): eCommerce global +23 %, Werbung global +38 %, Mitgliedsgebühren +17 %.<\/p>\n<h2 id=\"2-aktuelle-zahlen-q2-geschaftsjahr-2027-quartal-bis-31072026-bericht-20082026\">2. Aktuelle Zahlen (Q2 Geschäftsjahr 2027, Quartal bis 31.07.2026, Bericht 20.08.2026)<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Q2 FY27<\/th>\n<th>Vorjahr<\/th>\n<th>Konsens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gesamtumsatz<\/td>\n<td>187,937 Mrd. USD (+5,9 %, währungsbereinigt +5,1 %)<\/td>\n<td>177,402 Mrd.<\/td>\n<td>ca. 186,6 bis 186,8 Mrd.<\/td>\n<\/tr>\n<tr>\n<td>Operatives Ergebnis (GAAP)<\/td>\n<td>9,383 Mrd. USD (+28,8 %)<\/td>\n<td>7,286 Mrd.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Bereinigtes operatives Ergebnis (währungsbereinigt)<\/td>\n<td>9,248 Mrd. USD (+17,4 %)<\/td>\n<td>7,876 Mrd.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Gewinn je Aktie bereinigt<\/td>\n<td><strong>0,81 USD<\/strong><\/td>\n<td>0,68<\/td>\n<td>ca. 0,74<\/td>\n<\/tr>\n<tr>\n<td>Gewinn je Aktie GAAP<\/td>\n<td>0,80 USD<\/td>\n<td>0,88<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Segmente: Walmart U.S. 125,2 Mrd. USD (+3,5 %), Vergleichsumsatz ohne Treibstoff +2,6 % (Vorjahr 4,6 %); International 35,2 Mrd. (+12,8 %, währungsbereinigt +7,9 %); Sam’s Club 25,7 Mrd. (+8,8 %), Vergleichsumsatz +4,4 %.<\/p>\n<p>Der bereinigte Gewinn schliesst einen Nettoverlust aus Beteiligungen von 0,12 USD je Aktie aus und einen steuerlichen Vorteil von 0,11 USD. Zollrückerstattungen steigerten Bruttogewinn und operatives Ergebnis im Q2.<\/p>\n<p><strong>Prognose (Stand 20.08.2026, angehoben):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>neu<\/th>\n<th>vorher<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nettoumsatz Gesamtjahr (währungsbereinigt)<\/td>\n<td>+4,0 bis 5,0 %<\/td>\n<td>+3,5 bis 4,5 %<\/td>\n<\/tr>\n<tr>\n<td>Bereinigtes operatives Ergebnis<\/td>\n<td>+7,0 bis 8,5 %<\/td>\n<td>+6,0 bis 8,0 %<\/td>\n<\/tr>\n<tr>\n<td>Bereinigter Gewinn je Aktie<\/td>\n<td>2,80 bis 2,87 USD<\/td>\n<td>2,75 bis 2,85 USD<\/td>\n<\/tr>\n<tr>\n<td>Investitionen<\/td>\n<td>ca. 4,0 % des Umsatzes<\/td>\n<td>ca. 3,5 %<\/td>\n<\/tr>\n<tr>\n<td><strong>Q3: Nettoumsatz<\/strong><\/td>\n<td>+3,0 bis 3,75 %<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Q3: bereinigtes operatives Ergebnis<\/strong><\/td>\n<td>+2,0 bis 4,0 %<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Q3: bereinigter Gewinn je Aktie<\/strong><\/td>\n<td><strong>0,62 bis 0,64 USD<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Für Q3 nennt die Firma einen Gegenwind von über 100 Basispunkten, weil Flipkarts Grossanlass «Big Billion Days» in Q4 verschoben wurde. Analysten erwarten für das Gesamtjahr 2,88 USD (MarketBeat).<\/p>\n<p>Kapitalrückgabe: Jahresdividende 0,99 USD (je Quartal 0,2475). Rückkäufe bisher im Jahr 42,3 Mio. Aktien (5,1 Mrd. USD); von der im Februar 2026 genehmigten Summe von 30 Mrd. USD sind noch 25,1 Mrd. offen.<\/p>\n<h2 id=\"3-kurs-und-bewertung\">3. Kurs und Bewertung<\/h2>\n<ul>\n<li>Zuletzt gehandelt am Freitag, 23.10.2026: 119,89 USD (MarketBeat, tagsüber, minus rund 1 % zum Vortag). Schluss Donnerstag 22.10.: 121,12 USD. Den Schlusskurs vom Freitag habe ich nicht geprüft.<\/li>\n<li>Marktwert rund 951 bis 961 Mrd. USD. Für 1 Bio. USD wären rund 126 USD je Aktie nötig.<\/li>\n<li>KGV 43,3 (MarketBeat) bis ca. 44 (24/7 Wall St.). Eigene Rechnung: 121 USD geteilt durch 2,835 USD (Mitte der Prognose) ergibt rund 43 für das laufende Jahr.<\/li>\n<li>50-Tage-Schnitt 109,17 USD, 200-Tage-Schnitt 116,00 USD. Dividendenrendite ca. 0,8 %.<\/li>\n<li>Analysten: «Buy» (3 Strong Buy, 33 Buy, 3 Hold), durchschnittliches Kursziel 132,41 USD.<\/li>\n<li>Verlauf: 19.05.2026 Schluss 134,20 USD; 01.07. ca. -4,5 %; 20.08. -9,2 % (114,30 auf 103,84); 30.09. Schluss 103,92; 22.10. 121,12. Das sind +16,6 % im Oktober und noch rund 10,7 % unter dem Maistand (eigene Rechnung: 119,89 gegen 134,20).<\/li>\n<\/ul>\n<h2 id=\"4-termine\">4. Termine<\/h2>\n<table>\n<thead>\n<tr>\n<th>Datum<\/th>\n<th>Ereignis<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>19.11.2026<\/strong>, 07:00<\/td>\n<td>Q3-Zahlen Geschäftsjahr 2027<\/td>\n<td>laut MarketScreener; Zeitzone nicht angegeben, vermutlich US-Ostküste (Schweiz ca. 13:00); eine zweite Quelle nennt ihn «erwartet, nicht bestätigt»<\/td>\n<\/tr>\n<tr>\n<td>11.12.2026<\/td>\n<td>Ex-Dividenden-Tag, 0,2475 USD<\/td>\n<td>MarketScreener; Zahltag nicht angegeben<\/td>\n<\/tr>\n<tr>\n<td>18.02.2027, 07:00<\/td>\n<td>Q4- und Jahreszahlen Geschäftsjahr 2027<\/td>\n<td>MarketScreener, unbestätigt<\/td>\n<\/tr>\n<tr>\n<td>Juni 2027<\/td>\n<td>Hauptversammlung (2026: 04.06.)<\/td>\n<td>erwartet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Frühere Dividenden (Ex-Tage): 12.12.2025 (0,235 USD), 20.03.2026, 08.05.2026, 21.08.2026 (je 0,2475 USD).<\/p>\n<h2 id=\"5-eigentumer\">5. Eigentümer<\/h2>\n<table>\n<thead>\n<tr>\n<th>Halter<\/th>\n<th>Anteil<\/th>\n<th>Aktien<\/th>\n<th>Stand<\/th>\n<th>Verlässlichkeit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Walton Enterprises LLC<\/td>\n<td>37,63 %<\/td>\n<td>ca. 3,00 Mrd.<\/td>\n<td>Aug 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>Walton Family Holdings Trust<\/td>\n<td>6,92 %<\/td>\n<td>ca. 552 Mio.<\/td>\n<td>Aug 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>Vanguard<\/td>\n<td>5,39 %<\/td>\n<td>ca. 430 Mio.<\/td>\n<td>Aug 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>BlackRock (Institutional Trust)<\/td>\n<td>2,62 %<\/td>\n<td>ca. 209 Mio.<\/td>\n<td>Aug 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>State Street<\/td>\n<td>2,30 %<\/td>\n<td>ca. 184 Mio.<\/td>\n<td>Aug 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>Geode Capital<\/td>\n<td>1,18 %<\/td>\n<td>ca. 94 Mio.<\/td>\n<td>Aug 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>JPMorgan Asset Management<\/td>\n<td>0,89 %<\/td>\n<td>ca. 71 Mio.<\/td>\n<td>Aug 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<tr>\n<td>Norges Bank<\/td>\n<td>0,80 %<\/td>\n<td>ca. 64 Mio.<\/td>\n<td>Aug 2025<\/td>\n<td>berichtet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Insgesamt kontrolliert die Familie Walton rund 44,6 %. Aktien im Umlauf: 7,97 Mrd. (10-K, 11.03.2026). Der institutionelle Anteil liegt laut MarketBeat nur bei 26,8 %, weil die Familie so viel hält.<\/p>\n<p><strong>Insider-Verkäufe:<\/strong> Im letzten Quartal verkauften Führungskräfte 102’244 Aktien für rund 11,1 Mio. USD (zum Beispiel Daniel Danker: 50’644 Aktien am 26.08. zu 105,35 USD; Daniel Bartlett: 3’990 Aktien am 01.10.), alle nach vorab festgelegten Plänen. Verkäufe der Familie sind in der Quelle nicht erwähnt.<\/p>\n<p>Querverbindung: BlackRock, das erste Dossier in dieser Sammlung, ist Aktionär von Walmart.<\/p>\n<h2 id=\"6-verbindungen-wer-kauft-was-von-wem\">6. Verbindungen: wer kauft was von wem<\/h2>\n<table>\n<thead>\n<tr>\n<th>Walmart kauft oder hält<\/th>\n<th>Wert<\/th>\n<th>Datum<\/th>\n<th>Quelle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flipkart (Indien): 77 % übernommen<\/td>\n<td>rund 16 Mrd. USD<\/td>\n<td>2018<\/td>\n<td>Medien (berichtet)<\/td>\n<\/tr>\n<tr>\n<td>Flipkart: weitere Anteile (u. a. von Tiger Global)<\/td>\n<td>ca. 3,5 Mrd. USD<\/td>\n<td>2023<\/td>\n<td>TechCrunch (berichtet)<\/td>\n<\/tr>\n<tr>\n<td>PhonePe (Indien): Mehrheit<\/td>\n<td>nicht genannt<\/td>\n<td>2018<\/td>\n<td>10-K (belegt)<\/td>\n<\/tr>\n<tr>\n<td>Vizio (Fernseher, Smart-TV-System)<\/td>\n<td>11,50 USD je Aktie bar, rund 2,3 Mrd. USD<\/td>\n<td>Dez 2024<\/td>\n<td>Nasdaq (belegt)<\/td>\n<\/tr>\n<tr>\n<td>Walmex (Mexiko, Zentralamerika): Mehrheit<\/td>\n<td>Anteil nicht geprüft (geläufig ca. 70 %)<\/td>\n<td><\/td>\n<td>vermutet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Walmart verkauft / Partner<\/th>\n<th>Details<\/th>\n<th>Quelle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Symbotic kauft Walmarts Robotik-Sparte (Jan 2025)<\/td>\n<td>Walmart nimmt 400 Abhol- und Liefer-Zentren ab, Option auf 200; Preis nicht genannt<\/td>\n<td>TipRanks (berichtet)<\/td>\n<\/tr>\n<tr>\n<td>OpenAI (ChatGPT), seit Okt 2025<\/td>\n<td>Einkauf in ChatGPT blieb unter den Erwartungen; im März 2026 soll der Assistent Sparky in ChatGPT und Google Gemini<\/td>\n<td>Hardware Retailing (berichtet)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lieferanten:<\/strong> Walmart nennt im 10-K keine Lieferanten. Aus der Gegenrichtung: <strong>Procter &amp; Gamble<\/strong> erzielt laut eigenem Geschäftsbericht rund 16 % des Umsatzes mit Walmart und Töchtern (2024 bis 2026, belegt). Weitere grosse Lieferanten wie PepsiCo, Coca-Cola, Nestlé, Unilever sind allgemein bekannt, aber hier nicht quellengeprüft.<\/p>\n<p><strong>Kunden:<\/strong> Privatkunden (rund 280 Mio. pro Woche), Mitglieder (Sam’s Club, Gebühren +17 %), Werbekunden (Hersteller; Werbung +38 %).<\/p>\n<p><strong>Konkurrenten:<\/strong> Das 10-K nennt keine Namen. Allgemein bekannt: Amazon (Onlinehandel; in Indien gegen Flipkart), Costco (gegen Sam’s Club), Target, Kroger (vermutet, nicht quellengeprüft).<\/p>\n<h2 id=\"7-management\">7. Management<\/h2>\n<ul>\n<li>John Furner: President und CEO seit Februar 2026 (zuvor CEO Walmart U.S. und Sam’s Club; seit 1993 im Konzern). Belegt (10-K, Firmenseite).<\/li>\n<li>Doug McMillon: bisheriger CEO, Nachfolge am 14.11.2025 angekündigt (berichtet).<\/li>\n<li>John David Rainey: EVP und CFO (belegt, 10-K).<\/li>\n<li>Daniel Danker: EVP für KI, Produkt und Design (berichtet).<\/li>\n<li>Greg Penner: Verwaltungsratsvorsitzender (allgemein bekannt, <strong>vermutet<\/strong>).<\/li>\n<li><strong>Lücke:<\/strong> Verwaltungsrat nicht ausgewertet.<\/li>\n<\/ul>\n<h2 id=\"8-chancen-und-risiken\">8. Chancen und Risiken<\/h2>\n<p><strong>Chancen<\/strong>\n- Onlinehandel (+23 %), Werbung (+38 %) und Mitgliedschaften (+17 %) wachsen deutlich schneller als der Handel (+5,9 % Umsatz) und können die Marge heben.\n- Q2: Gewinn über dem Konsens, Jahresprognose angehoben, operatives Ergebnis +28,8 % (GAAP, mit Hilfe von Zollrückerstattungen).\n- Breite Basis: Lebensmittel und Alltagsbedarf, defensiv in schwachen Phasen.\n- Grosse Rückkaufermächtigung (25,1 Mrd. USD offen).<\/p>\n<p><strong>Risiken<\/strong>\n- <strong>Bewertung:<\/strong> KGV rund 43 bei einem Umsatzwachstum von 4 bis 5 %. Wenig Spielraum für Enttäuschungen.\n- <strong>Vorsichtiger Ausblick:<\/strong> Q3-Gewinn je Aktie 0,62 bis 0,64 USD und bereinigtes operatives Ergebnis nur +2 bis 4 %; Walmart will Zollrückerstattungen in Preise stecken.\n- <strong>Konsum und Preisdruck:<\/strong> Cleveland Research meldete am 01.07. langsameres Vergleichsumsatzwachstum (Aktie ca. -4,5 %; zweite Hand).\n- <strong>Rotation:<\/strong> Der Oktoberanstieg beruht laut 24/7 Wall St. auf Geldflüssen aus KI-Titeln; kehren sie zurück, könnte der Rückenwind enden.\n- <strong>Zölle:<\/strong> Importe aus Asien; neue Zölle möglich.\n- <strong>Regulierung:<\/strong> Kartellverfahren in Kanada, Mexiko und Indien (10-K).\n- <strong>Terminverschiebung Flipkart<\/strong> bremst Q3 um über 100 Basispunkte.<\/p>\n<h2 id=\"9-einordnung-langfristig\">9. Einordnung langfristig<\/h2>\n<p>Fakten zur Entscheidungshilfe, keine Empfehlung:\n- Walmart ist ein defensiver Wert mit klarem Wachstum in Online und Werbung. Die Frage ist der Preis: Bei KGV 43 ist viel Gutes schon im Kurs.\n- Der Anstieg im Oktober kam ohne Firmennachricht. Wie viel ist Stimmung, wie viel Substanz?\n- Die Familie Walton kontrolliert knapp die Hälfte. Das stabilisiert, begrenzt aber den Einfluss anderer Aktionäre.\n- Dividende ist gering (ca. 0,8 %). Der Ertrag kommt vor allem aus dem Kurs.\n- Alternative: breite ETFs enthalten Walmart bereits.<\/p>\n<h2 id=\"10-einordnung-kurzfristig\">10. Einordnung kurzfristig<\/h2>\n<ul>\n<li><strong>Liquidität:<\/strong> Sehr hoch.<\/li>\n<li><strong>Stückgrösse:<\/strong> Ein Stück kostet rund 120 USD. Das passt viel besser zu deinem Kapital als eine Aktie zu über 1’000 USD.<\/li>\n<li><strong>Kosten bei Saxo (grobe Rechnung für 1’000 USD):<\/strong> Courtage rund 1 USD je Seite, Stempelabgabe 0,15 % je Seite, zusammen ca. 5 USD (0,5 %); mit Währungswechsel ca. 1 %.<\/li>\n<li><strong>Lehrstück aus den letzten Wochen:<\/strong>\n  1. Am 20.08. waren Gewinn und Prognose besser als erwartet, und die Aktie fiel trotzdem um 9,2 %, weil der Ausblick auf das nächste Quartal schwach war.\n  2. Im Oktober stieg sie um 16,6 % ohne neue Firmennachricht.\n  Das heisst: «gute Zahlen» sagen nichts Sicheres über die Richtung. Entscheidend sind Erwartung und Ausblick.<\/li>\n<li><strong>Nächster Auslöser: 19.11.2026.<\/strong> Die Kursbewegung kann in beide Richtungen gross sein. Eine seriöse Prognose der Richtung kann ich nicht geben.<\/li>\n<li><strong>Vor dem 19.11. klären (nicht recherchiert):<\/strong> Konsens für Q3 (Gewinn je Aktie, Umsatz, Ausblick) und die vom Optionsmarkt erwartete Bewegung. Beides sage ich dir auf Zuruf kurz vor dem Termin.<\/li>\n<\/ul>\n<h2 id=\"11-watchlist-trigger-warnung-bei\">11. Watchlist-Trigger (Warnung bei)<\/h2>\n<ul>\n<li>Kurs unter dem 200-Tage-Schnitt (aktuell ca. 116 USD) oder Rückfall unter 109 USD (50-Tage-Schnitt).<\/li>\n<li>Q3-Zahlen: bereinigter Gewinn je Aktie gegen Konsens und Prognose (0,62 bis 0,64 USD), Vergleichsumsatz, Ausblick Q4 und Gesamtjahr.<\/li>\n<li>Neue Zölle, Änderungen bei den Zollrückerstattungen.<\/li>\n<li>Verkäufe der Familie Walton oder grössere Insider-Verkäufe.<\/li>\n<li>Nachrichten zu Flipkart (Börsengang, Kartellverfahren) und zur KI-Partnerschaft.<\/li>\n<\/ul>\n<h2 id=\"12-lucken-und-verlasslichkeit\">12. Lücken und Verlässlichkeit<\/h2>\n<ul>\n<li>Aktuelle Anteile an Flipkart, PhonePe und Walmex: nicht aus Primärquelle geprüft.<\/li>\n<li>Aktionärsdaten stammen von einer Drittseite (August 2025); verbindlich sind 13F und Proxy bei der SEC.<\/li>\n<li>Lieferanten ausser P&amp;G: nicht belegt.<\/li>\n<li>10-K nur über Auszüge gelesen; zu Beteiligungsanteilen, Rechtsfällen und Familienanteil fand ich dort nichts.<\/li>\n<li>Verwaltungsrat: nicht ausgewertet.<\/li>\n<li>Konsens für Q3, Optionsmarkt, Schlusskurs 23.10.: nicht geprüft.<\/li>\n<li>Kursverlauf-Zahlen stammen teils aus Artikeln mit eigenen Rechnungen (Dataporium).<\/li>\n<\/ul>\n<h2 id=\"13-quellen\">13. Quellen<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://stock.walmart.com/sec-filings/all-sec-filings/content/0000104169-26-000145/earningsreleasefy27q2.htm\">Walmart Q2-FY27-Mitteilung (8-K, 20.08.2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/Archives/edgar/data/104169/000010416926000055/wmt-20260131.htm\">Walmart Form 10-K Geschäftsjahr 2026 (SEC)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.marketbeat.com/instant-alerts/price-walmart-nasdaq-wmt-stock-falls-1-heres-why-2026-10-23/\">MarketBeat, 23.10.2026<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://247wallst.com/investing/2026/10/23/walmart-is-having-its-best-month-since-1999-and-is-4-from-1-trillion/\">24/7 Wall St., 23.10.2026<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://dataporium.tech/articles/walmart-fiscal-q2-2027-earnings-revenue-up-5-9-guidance-raised-shares-drop-9\">Dataporium: Q2 FY27<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.fool.com/investing/2026/07/01/why-walmart-plunged-today/\">Motley Fool, 01.07.2026<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ca.marketscreener.com/quote/stock/WALMART-INC-119075593/calendar/\">MarketScreener: Kalender<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.tikr.com/blog/who-owns-walmart-tracking-walmarts-top-shareholders-and-recent-insider-trades\">TIKR: Wem gehört Walmart<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/Archives/edgar/data/0000080424/000008042426000103/pg-20260630.htm\">Procter &amp; Gamble Form 10-K FY2026<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nasdaq.com/articles/walmart-completes-23b-acquisition-vizio\">Nasdaq: Vizio-Kauf abgeschlossen<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.tipranks.com/news/company-announcements/symbotic-expands-market-with-walmart-automation-deal\">TipRanks: Symbotic und Walmart<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://hardwareretailing.com/walmart-continues-openai-partnership-shifts-shopping-experience/\">Hardware Retailing: Walmart und OpenAI<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.thenewsminute.com/article/it-s-deal-walmart-completes-acquisition-77pc-stake-flipkart-86857\">The News Minute: Flipkart 77 %<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://techcrunch.com/2023/09/02/walmart-has-spent-3-5-billion-this-year-to-increase-stake-in-flipkart\">TechCrunch 2023: Flipkart-Anteil<\/a><\/li>\n<li><a target=\"_b  + ', ' + F.boerse + ')';\ndocument.getElementById('sub').textContent = 'Stand ' + F.stand + '. Keine Anlageberatung. Nur auf Zuruf erneuert.';\ndocument.getElementById('kpis').innerHTML = F.kennzahlen.map(k => `<div class=\"kpi\" title=\"${esc(k.hinweis||'')}\"><b>${esc(k.v)}<\/b><span>${esc(k.k)}<\/span><\/div>`).join('');\ndocument.getElementById('termine').innerHTML = '<b>Termine:<\/b> ' + F.termine.map(t => `${esc(t.d)}: ${esc(t.t)}`).join(' &nbsp;|&nbsp; ');\n\n// Daten\nconst NETZ = !!DATA.netz;\nconst nodes = DATA.knoten.map(n => ({...n, x:0, y:0, vx:0, vy:0, r: n.kat==='firma'?(NETZ?26:30):9+n.w*2.6, fixed:false}));\nconst byId = Object.fromEntries(nodes.map(n => [n.id, n]));\nconst edges = DATA.kanten.map((e,i) => ({...e, i, a:byId[e.von], b:byId[e.zu]}));\nconst catKeys = Object.keys(CATS).filter(k => k!=='firma' && nodes.some(n => n.kat===k));\nconst state = {cats:Object.fromEntries(catKeys.map(k=>[k,true])), verl:{belegt:true,berichtet:true,vermutet:true}, q:'', sel:null, selEdge:null};\n\n// Anker pro Kategorie auf einem Ring\nconst R = 430, anchors = {};\nconst _r = svg.getBoundingClientRect(); const ASP = Math.min(1.35, Math.max(0.85, (_r.width || 1000) / (_r.height || 700)));\ncatKeys.forEach((k,i) => { const ang = -Math.PI/2 + i*2*Math.PI/catKeys.length; anchors[k] = {x:Math.cos(ang)*R*ASP, y:Math.sin(ang)*R*0.95}; });\nanchors.firma = {x:0, y:0};\nconst hubs = nodes.filter(n => n.kat==='firma');\nif (NETZ) hubs.forEach((h,i) => { const ang = -Math.PI/2 + i*2*Math.PI/hubs.length; h.anchor = {x:Math.cos(ang)*330*ASP, y:Math.sin(ang)*330}; });\nnodes.forEach((n,i) => { const a = n.anchor || anchors[n.kat]; const t = i*2.399; n.x = a.x + Math.cos(t)*40*(1+ (i%5)/5); n.y = a.y + Math.sin(t)*40*(1+(i%5)/5); });\n\n// Aufbau SVG\nconst root = el('g', {}, svg);\nconst gCat = el('g', {}, root), gEdge = el('g', {}, root), gLab = el('g', {}, root), gNode = el('g', {}, root);\ncatKeys.forEach(k => { const t = el('text', {class:'catlabel', fill:CATS[k][1]}, gCat); t.textContent = CATS[k][0]; t._k = k; });\nedges.forEach(e => {\n  e.g = el('g', {class:'edge '+VERL[e.verl]}, gEdge);\n  e.line = el('line', {}, e.g); e.hit = el('line', {class:'hit'}, e.g);\n  e.hit.addEventListener('click', ev => { ev.stopPropagation(); selectEdge(e); });\n  e.lab = el('text', {class:'elabel'}, gLab); e.lab.style.display = 'none';\n});\nnodes.forEach(n => {\n  n.g = el('g', {class:'node'}, gNode);\n  n.c = el('circle', {r:n.r, fill:CATS[n.kat][1]}, n.g);\n  n.t = el('text', {dy: n.r+12}, n.g); n.t.textContent = n.name;\n  n.g.addEventListener('pointerdown', ev => startDrag(ev, n));\n});\n\n// Legende\nconst catsDiv = document.getElementById('cats');\ncatKeys.forEach(k => {\n  const l = document.createElement('label'); l.className = 'f';\n  l.innerHTML = `<input type=\"checkbox\" checked data-k=\"${k}\"><span class=\"dot\" style=\"background:${CATS[k][1]}\"><\/span>${CATS[k][0]}`;\n  catsDiv.appendChild(l);\n});\ncatsDiv.addEventListener('change', e => { state.cats[e.target.dataset.k] = e.target.checked; refresh(); });\ndocument.querySelectorAll('input[data-v]').forEach(i => i.addEventListener('change', () => { state.verl[i.dataset.v] = i.checked; refresh(); }));\ndocument.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); refresh(); });\n\n// Sichtbarkeit\nfunction visNode(n){ return n.kat==='firma' || state.cats[n.kat]; }\nfunction visEdge(e){ return visNode(e.a) && visNode(e.b) && state.verl[e.verl]; }\n\n// Physik\nlet alpha = 1;\nfunction step(){\n  const vis = nodes.filter(visNode);\n  for (let i=0;i<vis.length;i++) for (let j=i+1;j<vis.length;j++){\n    const a=vis[i], b=vis[j]; let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy+0.01, d=Math.sqrt(d2);\n    const min = a.r+b.r+100; let f = 12000/d2; if (d<min) f += (min-d)*0.5;\n    dx/=d; dy/=d; a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f;\n  }\n  edges.forEach(e => { if(!visEdge(e) || (!NETZ && (e.a.kat==='firma' || e.b.kat==='firma'))) return;\n    let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, d=Math.sqrt(dx*dx+dy*dy)+0.01; const L = (NETZ?170:90)+ (e.a.r+e.b.r), k=(NETZ?0.02:0.01)*(d-L)/d;\n    e.a.vx+=dx*k; e.a.vy+=dy*k; e.b.vx-=dx*k; e.b.vy-=dy*k; });\n  vis.forEach(n => { const a = n.anchor || anchors[n.kat]; const g = n.kat==='firma'?0.08:(NETZ?0.004:0.03);\n    n.vx += (a.x-n.x)*g; n.vy += (a.y-n.y)*g; n.vx*=0.82; n.vy*=0.82;\n    if(!n.fixed){ n.x += n.vx*alpha; n.y += n.vy*alpha; } });\n}\nfunction draw(){\n  nodes.forEach(n => { n.g.setAttribute('transform', `translate(${n.x},${n.y})`); });\n  edges.forEach(e => { for (const l of [e.line,e.hit]){ l.setAttribute('x1',e.a.x); l.setAttribute('y1',e.a.y); l.setAttribute('x2',e.b.x); l.setAttribute('y2',e.b.y); }\n    e.lab.setAttribute('x',(e.a.x+e.b.x)/2); e.lab.setAttribute('y',(e.a.y+e.b.y)/2-4); });\n  gCat.childNodes.forEach(t => { const a=anchors[t._k]; const ns=nodes.filter(n=>n.kat===t._k&&visNode(n)); if(!ns.length){t.style.display='none';return;} t.style.display='';\n    const cx=ns.reduce((s,n)=>s+n.x,0)/ns.length, cy=ns.reduce((s,n)=>s+n.y,0)/ns.length;\n    const len=Math.hypot(cx,cy)||1, ux=cx/len, uy=cy/len; const ext=Math.max(...ns.map(n=>Math.hypot(n.x-cx,n.y-cy)+n.r))+34;\n    t.setAttribute('x',cx+ux*ext*1.1); t.setAttribute('y',cy+uy*ext*0.8); });\n}\nfunction loop(){ if (alpha>0.02 || dragging){ step(); draw(); alpha*=0.992; if(dragging) alpha=Math.max(alpha,0.3);} requestAnimationFrame(loop); }\nfor (let i=0;i<500;i++) step(); alpha=0.6; draw();\n\n// Ansicht\nlet view = {x:0,y:0,k:1};\nfunction applyView(){ root.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);\n  const kk = Math.max(view.k, 0.35); svg.style.setProperty('--fs', Math.min(26, 13/kk*0.92) + 'px'); svg.style.setProperty('--fc', Math.min(22, 12/kk*0.9) + 'px'); }\nfunction fit(){ const r = svg.getBoundingClientRect(); const vis=nodes.filter(visNode);\n  const x0=Math.min(...vis.map(n=>n.x-n.r)), x1=Math.max(...vis.map(n=>n.x+n.r)), y0=Math.min(...vis.map(n=>n.y-n.r))-30, y1=Math.max(...vis.map(n=>n.y+n.r))+30;\n  const k = Math.min(r.width/(x1-x0+160), r.height/(y1-y0+60), 1.3); view.k=k; view.x=r.width/2-k*(x0+x1)/2; view.y=r.height/2-k*(y0+y1)/2; applyView(); }\ndocument.getElementById('reset').onclick = () => { state.sel=null; state.selEdge=null; document.getElementById('q').value=''; state.q=''; fit(); refresh(); showHint(); };\nsvg.addEventListener('wheel', ev => { ev.preventDefault(); const r=svg.getBoundingClientRect(); const mx=ev.clientX-r.left, my=ev.clientY-r.top;\n  const f = ev.deltaY<0?1.12:1/1.12; const nk=Math.max(0.2,Math.min(4,view.k*f)); view.x=mx-(mx-view.x)*nk/view.k; view.y=my-(my-view.y)*nk/view.k; view.k=nk; applyView(); }, {passive:false});\nlet panning=null, dragging=null, moved=false;\nsvg.addEventListener('pointerdown', ev => { if (ev.target!==svg) return; panning={x:ev.clientX-view.x,y:ev.clientY-view.y}; moved=false; svg.classList.add('pan'); svg.setPointerCapture(ev.pointerId); });\nfunction startDrag(ev,n){ ev.stopPropagation(); dragging=n; n.fixed=true; moved=false; svg.setPointerCapture(ev.pointerId); }\nsvg.addEventListener('pointermove', ev => {\n  if (panning){ view.x=ev.clientX-panning.x; view.y=ev.clientY-panning.y; moved=true; applyView(); }\n  else if (dragging){ const r=svg.getBoundingClientRect(); dragging.x=(ev.clientX-r.left-view.x)/view.k; dragging.y=(ev.clientY-r.top-view.y)/view.k; moved=true; alpha=Math.max(alpha,0.3); }\n});\nsvg.addEventListener('pointerup', ev => {\n  if (panning){ panning=null; svg.classList.remove('pan'); if(!moved){ state.sel=null; state.selEdge=null; showHint(); refresh(); } }\n  if (dragging){ const n=dragging; dragging=null; n.fixed=false; if(!moved) select(n); }\n});\n\n// Auswahl und Darstellung\nfunction neighbors(n){ const s=new Set([n.id]); edges.forEach(e=>{ if(!visEdge(e)) return; if(e.a===n) s.add(e.b.id); if(e.b===n) s.add(e.a.id); }); return s; }\nfunction refresh(){\n  const nb = state.sel ? neighbors(state.sel) : null;\n  nodes.forEach(n => {\n    const v = visNode(n); n.g.style.display = v ? '' : 'none';\n    let dim = false;\n    if (nb && !nb.has(n.id)) dim = true;\n    if (state.selEdge && state.selEdge.a!==n && state.selEdge.b!==n) dim = true;\n    if (state.q && !(n.name+' '+n.text).toLowerCase().includes(state.q)) dim = true;\n    n.g.classList.toggle('dim', dim); n.g.classList.toggle('sel', n===state.sel);\n  });\n  edges.forEach(e => {\n    const v = visEdge(e); e.g.style.display = v ? '' : 'none';\n    const on = state.sel && (e.a===state.sel || e.b===state.sel);\n    const onE = state.selEdge===e;\n    e.g.classList.toggle('hl', !!(on||onE));\n    e.g.classList.toggle('dim', !!((state.sel && !on) || (state.selEdge && !onE)));\n    e.lab.style.display = (v && (on||onE)) ? '' : 'none'; e.lab.textContent = e.label + (e.betrag? ' ('+e.betrag+')':'');\n  });\n  alpha = Math.max(alpha,0.35); draw();\n}\nfunction srcList(q){ return q && q.length ? '<ul>'+q.map(s=>`<li><a href=\"${esc(s.url)}\" target=\"_blank\" rel=\"noopener\">${esc(s.titel)}<\/a><\/li>`).join('')+'<\/ul>' : '<p class=\"hint\">Keine Quelle (Einordnung).<\/p>'; }\nfunction showHint(){ document.getElementById('detail').classList.remove('open'); }\nfunction addClose(d){ const b = document.createElement('button'); b.className = 'x'; b.textContent = '×'; b.title = 'Schliessen'; b.onclick = () => { state.sel = null; state.selEdge = null; showHint(); refresh(); }; d.appendChild(b); d.classList.add('open'); }\nfunction select(n){ state.sel=n; state.selEdge=null; refresh();\n  const conn = edges.filter(e=>visEdge(e)&&(e.a===n||e.b===n)).map(e=>{ const o=e.a===n?e.b:e.a; return `<li class=\"lnk\" data-id=\"${o.id}\">${esc(o.name)}: ${esc(e.label)}${e.betrag?' ('+esc(e.betrag)+')':''}<\/li>`; }).join('');\n  const d = document.getElementById('detail');\n  d.innerHTML = `<h2>${esc(n.name)}<\/h2><span class=\"badge\" style=\"border-color:${CATS[n.kat][1]};color:${CATS[n.kat][1]}\">${CATS[n.kat][0]}<\/span><span class=\"badge\">${esc(n.verl)}<\/span>\n    <p>${esc(n.text)}<\/p>${n.betrag?`<div class=\"kv\">Betrag: <b>${esc(n.betrag)}<\/b><\/div>`:''}${n.datum?`<div class=\"kv\">Datum / Stand: ${esc(n.datum)}<\/div>`:''}\n    ${(n.auch&&n.auch.length)?`<p class=\"kv\">Auch in den Dossiers: ${n.auch.map(t=>IN_FRAME?`<button data-go=\"${esc(t)}\">${esc(t)}<\/button>`:esc(t)).join(' ')}<\/p>`:''}${n.dossier?(IN_FRAME?`<p><button data-go=\"${esc(n.dossier)}\">Dossier ${esc(n.dossier)} öffnen<\/button><\/p>`:`<p class=\"hint\">Eigenes Dossier vorhanden: ${esc(n.dossier)}<\/p>`):''}<h3 class=\"hint\">Verbindungen<\/h3><ul>${conn}<\/ul><h3 class=\"hint\">Quellen<\/h3>${srcList(n.quellen)}`;\n  d.querySelectorAll('li.lnk').forEach(li => li.onclick = () => select(byId[li.dataset.id]));\n  d.querySelectorAll('button[data-go]').forEach(b => b.onclick = () => window.parent.postMessage({go:b.dataset.go}, '*'));\n  addClose(d);\n}\nfunction selectEdge(e){ state.sel=null; state.selEdge=e; refresh();\n  const d = document.getElementById('detail');\n  d.innerHTML = `<h2>${esc(e.a.name)} und ${esc(e.b.name)}<\/h2><span class=\"badge\">${esc(e.verl)}<\/span><p>${esc(e.label)}<\/p>${e.betrag?`<div class=\"kv\">Betrag: <b>${esc(e.betrag)}<\/b><\/div>`:''}<h3 class=\"hint\">Quellen<\/h3>${srcList(e.quellen)}`;\n  addClose(d);\n}\nwindow.addEventListener('resize', fit);\nfit(); refresh(); requestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n", "netz_info": {"akteure": ["Geode Capital", "JPMorgan Asset Management", "State Street", "Vanguard"], "verbindungen": ["Walmart (Beteiligung über Fonds): Grossaktionär über Fonds und ETFs"]}, "regeln_html": "<h1 id=\"invest-grundlage-projekt-infofeed\">Invest-Grundlage (Projekt «infofeed»)<\/h1>\n<p>Ziel: Geld verdienen, mit mehreren Standbeinen (langfristig, kurzfristig). Dies ist die Arbeitsgrundlage. Keine Anlageberatung.<\/p>\n<h2 id=\"ordnerstruktur\">Ordnerstruktur<\/h2>\n<p><code>invest/\n  index.html                 START HIER: eine Datei, die alles zeigt (Doppelklick)\n  README.md                  diese Datei: Regeln und Befehle\n  watchlist.csv              Firmen, die ich beobachte (mit Triggern und Terminen)\n  _vorlagen/dossier-vorlage.md   Gerüst für jeden Firmenbericht\n  _journal/papier-journal.csv    Übungshandel auf Papier (und später echte Trades)\n  _tools/                    Mindmap-Vorlage und Bau-Skript\n  firmen/&lt;TICKER-Name&gt;/\n    bericht.md               schriftlicher Bericht\n    daten.json               alle Fakten, Verbindungen, Quellen (Quelle der Wahrheit)\n    mindmap.html             interaktive Mindmap (Doppelklick, öffnet im Browser)\n    stand.txt                Datum der letzten Erneuerung<\/code><\/p>\n<h2 id=\"befehle-an-claude\">Befehle an Claude<\/h2>\n<ul>\n<li>«Neue Firma: <Name>»: Recherche, bericht.md, daten.json, mindmap.html, Eintrag in watchlist.csv.\n  Jede neue Firma wird automatisch mit den bestehenden verbunden: gemeinsame Aktionäre, Lieferanten oder Kunden (Feld <code>entity<\/code>) und Firmen mit eigenem Dossier (Feld <code>dossier<\/code>) erscheinen im Gesamtnetz und als «Auch in den Dossiers» in den Knoten.<\/li>\n<li>«Erneuere <Firma>»: nur Neues einarbeiten, Stand-Datum aktualisieren, Mindmap neu bauen.<\/li>\n<li>«Was steht an?»: Termine aller Firmen in der Watchlist (Berichte, Dividenden) prüfen.<\/li>\n<li>«Auswertung <Firma> Bericht»: neue Zahlen gegen die Erwartung (Konsens) einordnen.<\/li>\n<li>«Seite neu bauen»: baut <code>index.html<\/code> aus allen Dossiers neu (passiert nach jeder Änderung automatisch).<\/li>\n<li>Erneuert wird nur auf Zuruf.<\/li>\n<\/ul>\n<h2 id=\"startseite\">Startseite<\/h2>\n<p>Die Datei <code>index.html<\/code> ist eigenständig und braucht kein Internet. Sie enthält Übersicht, alle Berichte, alle Mindmaps, die chronologischen Berichtstermine (Quartals- und Jahresberichte aller Firmen, vergangene mit Ergebnis), das Gesamtnetz, diese Regeln und das Trade-Journal. Im Journal legt «Speichern» die Datei <code>_journal/papier-journal.csv<\/code> im gewählten Ordner ab (nur Chrome und Edge; sonst Download). Die einzelnen Dateien in den Firmenordnern bleiben zusätzlich bestehen (zum Beispiel <code>mindmap.html<\/code> einzeln öffnen).<\/p>\n<h2 id=\"verlasslichkeit-jeder-aussage\">Verlässlichkeit jeder Aussage<\/h2>\n<table>\n<thead>\n<tr>\n<th>Stufe<\/th>\n<th>Bedeutung<\/th>\n<th>Mindmap-Linie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>belegt<\/td>\n<td>Primärquelle (Firma, SEC, Börse)<\/td>\n<td>durchgezogen<\/td>\n<\/tr>\n<tr>\n<td>berichtet<\/td>\n<td>Medien oder Datenseiten, nicht selbst gegengeprüft<\/td>\n<td>gestrichelt<\/td>\n<\/tr>\n<tr>\n<td>vermutet<\/td>\n<td>Einordnung oder Annahme ohne Quelle<\/td>\n<td>gepunktet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Jede Verbindung hat Quelle und Datum. Was ich nicht finde, steht als Lücke im Bericht, nicht als Behauptung.<\/p>\n<h2 id=\"wichtige-fallen-bei-zahlen\">Wichtige Fallen bei Zahlen<\/h2>\n<ul>\n<li><strong>GAAP gegen «as adjusted»:<\/strong> Der Markt vergleicht meist den bereinigten Gewinn je Aktie mit dem Konsens. Ein Vergleich von GAAP mit Konsens zeigt fälschlich einen «Miss».<\/li>\n<li><strong>Gut/schlecht ist relativ:<\/strong> Der Kurs reagiert auf Abweichung von der Erwartung und auf den Ausblick, nicht auf die Zahl selbst.<\/li>\n<li><strong>Datenseiten widersprechen sich<\/strong> (Kurs, 52-Wochen-Hoch, Reaktion am Berichtstag). Ich nenne dann beide Werte.<\/li>\n<\/ul>\n<h2 id=\"risikoregeln-aus-deinen-vorgaben\">Risikoregeln (aus deinen Vorgaben)<\/h2>\n<ul>\n<li>Startkapital rund 3000 CHF, aufgeteilt in ETF, Aktien, Kurzfrist-Topf.<\/li>\n<li>Maximal tragbarer Verlust: 300 CHF gesamt.<\/li>\n<li>Pro Trade riskierst du höchstens 30 CHF (1 % des Kapitals), mit Stop-Loss vor dem Einstieg.<\/li>\n<li>Monatsverlust 150 CHF: Pause bis zum nächsten Monat.<\/li>\n<li>Gesamtverlust 300 CHF: Stopp und Ansatz überdenken.<\/li>\n<li>Kurzfrist-Topf klein halten (zum Beispiel 600 bis 900 CHF).<\/li>\n<\/ul>\n<h2 id=\"papier-phase-fur-kurzfrist-trades\">Papier-Phase für Kurzfrist-Trades<\/h2>\n<ol>\n<li>Mindestens 2 bis 3 Monate und mindestens 30 Trades auf Papier, jeder mit Begründung im Journal.<\/li>\n<li>Alle Kosten einrechnen: Courtage, Stempelabgabe (Saxo: 0,15 % auf ausländische Titel, bei Kauf und Verkauf), Währungswechsel (Saxo: 0,25 %), Spread.<\/li>\n<li>Erst wenn das Ergebnis nach Kosten klar positiv ist (und nicht von einem einzigen Glückstreffer abhängt), kleine echte Beträge.<\/li>\n<li>Gewinne aus sehr aktivem Handel können in der Schweiz steuerlich als selbständige Erwerbstätigkeit gelten. Früh mit einer Steuerberatung klären.<\/li>\n<\/ol>\n<h2 id=\"broker-stand-oktober-2026-vergleichsblogs-bitte-selbst-prufen\">Broker (Stand Oktober 2026, Vergleichsblogs, bitte selbst prüfen)<\/h2>\n<ul>\n<li>Langfristig: Saxo (Classic: 0,08 %, min. 3 CHF bzw. 1 USD; keine Depotgebühr; kostenloser Steuerauszug).<\/li>\n<li>Kurzfristig: Interactive Brokers ist deutlich günstiger (keine Stempelabgabe, Währungswechsel fast gratis), aber komplexer und mit kostenpflichtigem Steuerauszug.<\/li>\n<\/ul>", "watchlist": [{"Ticker": "BLK", "Firma": "BlackRock, Inc.", "Börse": "NYSE", "Typ": "Langfrist-Kandidat", "Aufgenommen": "2026-10-25", "Nächster Termin": "Dividendenerklärung erwartet ca. Nov 2026 | Q4-Zahlen erwartet ca. Mitte Jan 2027 (nicht bestätigt)", "Trigger (Warnung bei)": "Rücknahme-Stopp bei weiteren HPS/Private-Credit-Fonds | AUM-Rückgang | Kurs unter 200-Tage-Linie (ca. 1069 USD) | Wechsel an der Konzernspitze", "Ordner": "firmen/BLK-BlackRock"}, {"Ticker": "WMT", "Firma": "Walmart Inc.", "Börse": "Nasdaq", "Typ": "Langfrist-Kandidat", "Aufgenommen": "2026-10-25", "Nächster Termin": "Q3-Zahlen 19.11.2026 (laut MarketScreener) | Ex-Dividende 11.12.2026", "Trigger (Warnung bei)": "Kurs unter 200-Tage-Schnitt (ca. 116 USD) | Q3-Gewinn je Aktie gegen Konsens und Prognose 0,62 bis 0,64 USD | neue Zölle | Verkäufe der Familie Walton", "Ordner": "firmen/WMT-Walmart"}, {"Ticker": "OroraTech", "Firma": "OroraTech (München, Satelliten-Waldbrandwarnung)", "Börse": "nicht börsennotiert", "Typ": "Start-up (Video-Tipp)", "Aufgenommen": "25.10.2026", "Nächster Termin": "keine Berichtspflicht", "Trigger (Warnung bei)": "Finanzierungsrunde, Börsengang (IPO) oder Übernahme angekündigt", "Ordner": "kein Dossier"}, {"Ticker": "Black Semi", "Firma": "Black Semiconductor (Aachen, Chips)", "Börse": "nicht börsennotiert", "Typ": "Start-up (Video-Tipp)", "Aufgenommen": "25.10.2026", "Nächster Termin": "keine Berichtspflicht", "Trigger (Warnung bei)": "Finanzierungsrunde, Börsengang (IPO) oder Übernahme angekündigt", "Ordner": "kein Dossier"}, {"Ticker": "Proxima", "Firma": "Proxima Fusion (München, Kernfusion)", "Börse": "nicht börsennotiert", "Typ": "Start-up (Video-Tipp)", "Aufgenommen": "25.10.2026", "Nächster Termin": "keine Berichtspflicht", "Trigger (Warnung bei)": "Finanzierungsrunde, Börsengang (IPO) oder Übernahme angekündigt", "Ordner": "kein Dossier"}, {"Ticker": "AMBOSS", "Firma": "AMBOSS (Berlin, Medizin-Software)", "Börse": "nicht börsennotiert", "Typ": "Start-up (Video-Tipp)", "Aufgenommen": "25.10.2026", "Nächster Termin": "keine Berichtspflicht", "Trigger (Warnung bei)": "Finanzierungsrunde, Börsengang (IPO) oder Übernahme angekündigt", "Ordner": "kein Dossier"}], "gebaut": "25.10.2026"};
const $ = (s, r=document) => r.querySelector(s);

const rel = (s, d) => { const n = days(s); const ca = /erwartet|ca\./i.test(d) ? 'ca. ' : ''; return n === 0 ? 'heute' : n > 0 ? `${ca}in ${n} Tagen` : `vor ${-n} Tagen`; };
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e) { return null; } }

const ARTEN = {Quartal:'Quartalsbericht', Jahr:'Jahresbericht', Dividende:'Dividende', HV:'Hauptversammlung'};

const stChip = t => `<span class="chip ${t.status === 'bestätigt' ? 'ok' : 'w'}">${esc(t.status || 'unbestätigt')}</span>`;

  h += '<h2>Firmen</h2><div class="grid">' + F.map(f => { const n = nextTermin(f);
    return `<div class="card"><h3>${esc(f.name)}</h3><div><span class="chip t">${esc(f.ticker)}</span><span class="chip">${esc(f.boerse)}</span><span class="chip">${esc(f.typ)}</span></div>

    <a class="btn pri" href="#/firma/${f.ticker}">Bericht</a> <a class="btn" href="#/firma/${f.ticker}/mindmap">Mindmap</a></div>`; }).join('') + '</div>';

    SITE.watchlist.map(w => `<tr><td>${byT[w.Ticker] ? `<a href="#/firma/${esc(w.Ticker)}">${esc(w.Ticker)}</a>` : esc(w.Ticker)}</td><td>${esc(w['Firma'])}</td><td>${esc(w.Typ)}</td><td>${esc(w['Trigger (Warnung bei)'])}</td></tr>`).join('') + '</table></div>';
  h += `<div class="note"><b>Befehle an Claude:</b> «Neue Firma: …» legt Dossier, Mindmap und Watchlist-Eintrag an und verbindet sie mit den bestehenden Firmen. «Erneuere …» aktualisiert nur auf Zuruf. «Was steht an?» prüft alle Termine. Die Seite wird danach neu gebaut.</div>`;
  return h;
}
let TF = {nur: true, firma: ''};
function pageTermine(){

}

async function idbGet(k){ try { const d = await idb(); return await new Promise(res => { const q = d.transaction('h').objectStore('h').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch(e) { return null; } }
async function idbSet(k, v){ try { const d = await idb(); await new Promise(res => { const t = d.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch(e) {} }
const jq = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
function jCsv(rows){ return '﻿' + JF.join(';') + '\r\n' + rows.map(r => JF.map(k => jq(r[k])).join(';')).join('\r\n') + '\r\n'; }
function jParse(txt){ txt = txt.replace(/^﻿/, ''); const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++) { const c = txt[i];
    if (q) { if (c === '"') { if (txt[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ';') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i+1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x !== '')) out.push(row); row = []; }
    else cur += c; }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  const head = out.shift() || []; return out.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
}
async function jFile(dir, create){ let d = dir; if (dir.name !== '_journal') d = await dir.getDirectoryHandle('_journal', {create: true}); return d.getFileHandle('papier-journal.csv', {create}); }
async function jWrite(){ if (!jDir) return false;
  try { if ((await jDir.queryPermission({mode: 'readwrite'})) !== 'granted' && (await jDir.requestPermission({mode: 'readwrite'})) !== 'granted') { jMsg = 'Zugriff auf den Ordner fehlt. Klicke «Speichern».'; return false; }
    const fh = await jFile(jDir, true); const w = await fh.createWritable(); await w.write(new Blob([jCsv(jLoad())], {type: 'text/csv;charset=utf-8'})); await w.close();
    jMsg = 'Gespeichert in «' + jDir.name + '» um ' + new Date().toLocaleTimeString('de-CH'); return true;
  } catch(e) { jMsg = 'Speichern in den Ordner nicht möglich (' + (e.name || 'Fehler') + '). Die Einträge bleiben im Browser.'; return false; }
}
function jDownload(){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([jCsv(jLoad())], {type: 'text/csv;charset=utf-8'})); a.download = 'papier-journal.csv'; a.click(); jMsg = 'Datei «papier-journal.csv» heruntergeladen (Ordner «Downloads»).'; }
async function jConnect(){
  const dir = await window.showDirectoryPicker({mode: 'readwrite', id: 'invest-journal'}); jDir = dir; await idbSet('dir', dir);
  try { const fh = await jFile(dir, false); const old = jParse(await (await fh.getFile()).text()); const cur = jLoad(); const keys = new Set(cur.map(r => JSON.stringify(JF.map(k => r[k] ?? ''))));
    old.forEach(r => { const k = JSON.stringify(JF.map(x => r[x] ?? '')); if (!keys.has(k)) { cur.push(r); keys.add(k); } }); store(JK, JSON.stringify(cur)); } catch(e) {}
  await jWrite();
}
async function jSaveClick(){
  if (jDir) { await jWrite(); }
  else if (FS_OK) { try { await jConnect(); } catch(e) { if (e.name === 'AbortError') return; jMsg = 'Ordner konnte nicht verbunden werden (' + (e.name || 'Fehler') + ').'; } }
  else jDownload();
  route();
}
async function jRestore(){ if (!FS_OK || jDir) return; const h = await idbGet('dir'); if (h) { jDir = h; jMsg = 'Mit Ordner «' + h.name + '» verbunden. Beim ersten Eintrag fragt der Browser einmal nach Erlaubnis.'; if (location.hash === '#/journal') route(); } }
jRestore();
function pageJournal(){
  const rows = jLoad();
  const opts = F.map(f => `<option>${esc(f.ticker)}</option>`).join('');
  const sum = a => a.reduce((s, r) => s + (parseFloat(r['Ergebnis netto CHF']) || 0), 0);
  const stats = art => { const r = rows.filter(x => x.Art === art); const w = r.filter(x => parseFloat(x['Ergebnis netto CHF']) > 0).length;
    const mon = new Date().toISOString().slice(0, 7); const m = sum(r.filter(x => (x.Datum||'').startsWith(mon)));
    return {n: r.length, w, tot: sum(r), mon: m}; };
  const P = stats('Papier'), E = stats('Echt');
  let alerts = '';
  if (E.tot <= -300) alerts += '<div class="note alert"><b>Gesamtverlust von 300 CHF erreicht.</b> Regel: Stopp und Ansatz überdenken.</div>';
  else if (E.mon <= -150) alerts += '<div class="note alert"><b>Monatsverlust von 150 CHF erreicht.</b> Regel: Pause bis zum nächsten Monat.</div>';
  const line = (n, s) => `<tr><td>${n}</td><td class="num">${s.n}</td><td class="num">${s.n ? Math.round(100 * s.w / s.n) + ' %' : '–'}</td><td class="num ${s.tot < 0 ? 'badc' : 'good'}">${s.tot.toFixed(2)}</td><td class="num ${s.mon < 0 ? 'badc' : 'good'}">${s.mon.toFixed(2)}</td></tr>`;
  const todayIso = new Date().toISOString().slice(0, 10);
  return `<h1>Trade-Journal</h1><p class="sub">Übungstrades (Papier) und echte Trades mit Begründung <b>vor</b> dem Einstieg. Einträge bleiben in diesem Browser. Mit «Speichern» legst du zusätzlich die Datei <code>_journal/papier-journal.csv</code> in deinem Invest-Ordner ab (ab dem zweiten Mal automatisch bei jedem Eintrag).</p>${alerts}
  <div class="tw"><table><tr><th>Art</th><th>Trades</th><th>Trefferquote</th><th>Summe netto CHF</th><th>Dieser Monat CHF</th></tr>${line('Papier', P)}${line('Echt', E)}</table></div>
  <p class="sub">Regeln: höchstens 30 CHF Risiko pro Trade, Pause bei 150 CHF Monatsverlust, Stopp bei 300 CHF Gesamtverlust. Ziel der Papier-Phase: mindestens 30 Trades, nach allen Kosten klar positiv.</p>
  <form class="j" id="jf">
    <label>Datum<input type="date" name="Datum" value="${todayIso}" required></label>
    <label>Art<select name="Art"><option>Papier</option><option>Echt</option></select></label>
    <label>Ticker<input name="Ticker" list="tk" required><datalist id="tk">${opts}</datalist></label>
    <label>Stück<input name="Stück" type="number" step="any"></label>
    <label>Einstieg<input name="Einstieg" type="number" step="any"></label>
    <label>Stop-Loss<input name="Stop-Loss" type="number" step="any"></label>
    <label>Ausstieg<input name="Ausstieg" type="number" step="any"></label>
    <label>Kosten CHF<input name="Kosten CHF" type="number" step="any"></label>
    <label>Ergebnis netto CHF<input name="Ergebnis netto CHF" type="number" step="any"></label>
    <label class="wide">Begründung (vor dem Trade)<textarea name="Begründung" rows="2"></textarea></label>
    <label class="wide">Lehre<textarea name="Lehre" rows="2"></textarea></label>
    <div class="wide"><button class="btn pri" type="submit">Eintrag speichern</button> <button type="button" id="jx">${jDir ? 'Jetzt speichern' : FS_OK ? 'Speichern (Ordner wählen)' : 'Speichern (Datei laden)'}</button> <span class="sub" id="jmsg">${esc(jMsg || (FS_OK ? 'Noch kein Ordner verbunden: wähle deinen Invest-Ordner.' : 'Dieser Browser kann nicht direkt in Ordner schreiben (nur Chrome und Edge). Es wird eine Datei heruntergeladen.'))}</span> <button type="button" id="jd">Alle löschen</button></div>
  </form>
  <div class="tw"><table><tr>${JF.map(x => `<th>${x}</th>`).join('')}<th></th></tr>${rows.map((r, i) => `<tr>${JF.map(x => `<td>${esc(r[x])}</td>`).join('')}<td><button data-del="${i}">×</button></td></tr>`).reverse().join('') || `<tr><td colspan="${JF.length + 1}" class="sub">Noch keine Einträge.</td></tr>`}</table></div>`;
}
function bindJournal(){
  const f = $('#jf'); if (!f) return;
  f.onsubmit = async e => { e.preventDefault(); const r = {}; new FormData(f).forEach((v, k) => r[k] = v); const rows = jLoad(); rows.push(r); store(JK, JSON.stringify(rows)); await jWrite(); route(); };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { const rows = jLoad(); rows.splice(+b.dataset.del, 1); store(JK, JSON.stringify(rows)); await jWrite(); route(); });
  $('#jd').onclick = async () => { if (confirm('Alle Journal-Einträge in diesem Browser löschen? Die Datei im Ordner wird dabei ebenfalls überschrieben.')) { store(JK, '[]'); await jWrite(); route(); } };
  $('#jx').onclick = jSaveClick;
}

// Router
function route(){
  const h = location.hash || '#/'; const p = h.split('/').filter(Boolean);
  buildNav(h); let html, after = () => {};
  if (p[1] === 'termine' && p[0] === '#') { html = pageTermine(); after = bindTermine; }
  else if (p[1] === 'netz') { html = pageNetz(); after = () => { const fr = $('#mm'); fr.srcdoc = SITE.netz_html; fr.onload = () => fr.contentWindow.postMessage({theme}, '*'); }; }
  else if (p[1] === 'regeln') html = pageRegeln();
  else if (p[1] === 'journal') { html = pageJournal(); after = bindJournal; }
  else if (p[1] === 'firma') { const tab = p[3] || 'bericht'; html = pageFirma(p[2], tab); after = () => afterFirma(p[2], tab); }
  else html = pageHome();
  $('#view').innerHTML = html; $('#main').scrollTop = 0; after();
}
function afterFirma(t, tab){
  const f = byT[t]; if (!f) return;
  if (tab === 'mindmap') { const fr = $('#mm'); fr.srcdoc = f.mindmap_html; fr.onload = () => fr.contentWindow.postMessage({theme}, '*');
    $('#mmfull').onclick = () => { const w = window.open('', '_blank'); if (w) { w.document.open(); w.document.write(f.mindmap_html); w.document.close(); } }; }
  else if (tab === 'bericht') {
    document.querySelectorAll('.doc table').forEach(tb => { const w = document.createElement('div'); w.className = 'tw'; tb.replaceWith(w); w.appendChild(tb); });
    const hs = [...document.querySelectorAll('#doc h2')];
    $('#toc').innerHTML = '<b>Inhalt</b>' + hs.map(x => `<a href="#" data-id="${x.id}">${esc(x.textContent)}</a>`).join('');
    document.querySelectorAll('#toc a').forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.dataset.id).scrollIntoView({behavior:'smooth', block:'start'}); });
  }
}
window.addEventListener('message', e => { const g = e.data && e.data.go; if (g && byT[g]) location.hash = '#/firma/' + g; });
window.addEventListener('hashchange', route);
applyTheme(); route();
</script>
</body>
