<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmap</title>
<style>
:root{--bg:#0f1218;--panel:#171b24;--line:#2a3140;--tx:#e6e9ef;--mut:#9aa3b5;--acc:#6ea8fe}
@media (prefers-color-scheme: light){
  :root{--bg:#f4f5f8;--panel:#ffffff;--line:#d9dde6;--tx:#1b2030;--mut:#5b6478;--acc:#2a5db0}
}
:root[data-theme=dark]{--bg:#0f1218;--panel:#171b24;--line:#2a3140;--tx:#e6e9ef;--mut:#9aa3b5;--acc:#6ea8fe}
:root[data-theme=light]{--bg:#f4f5f8;--panel:#ffffff;--line:#d9dde6;--tx:#1b2030;--mut:#5b6478;--acc:#2a5db0}
*{box-sizing:border-box}
html.in-frame header{display:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0 0 2px}
header .sub{color:var(--mut);font-size:12px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--bg)}
.kpi b{display:block;font-size:14px}
.kpi span{color:var(--mut);font-size:11px}
.termine{margin-top:8px;color:var(--mut);font-size:12px}
.termine b{color:var(--tx)}
main{flex:1;display:flex;min-height:0}
aside{width:230px;border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto;flex:none}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 6px}
aside h3:first-child{margin-top:0}
label.f{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
input[type=search]{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.ln{display:inline-block;width:26px;height:0;border-top:2px solid var(--mut);vertical-align:middle;margin-right:6px}
.ln.d{border-top-style:dashed}.ln.p{border-top-style:dotted}
#stage{flex:1;position:relative;min-width:0}
svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg.pan{cursor:grabbing}
.node circle{stroke:var(--bg);stroke-width:2;cursor:pointer}
.node text{font-size:var(--fs,13px);fill:var(--tx);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none;text-anchor:middle}
.node.dim,.edge.dim{opacity:.12}
.node.sel circle{stroke:var(--tx);stroke-width:3}
.edge line{stroke:var(--mut);stroke-width:1.4}
.edge.d line{stroke-dasharray:6 4}.edge.p line{stroke-dasharray:2 4}
.edge.hl line{stroke:var(--acc);stroke-width:2.4}
.edge .hit{stroke:transparent;stroke-width:12;cursor:pointer}
.elabel{font-size:10.5px;fill:var(--acc);paint-order:stroke;stroke:var(--bg);stroke-width:3px;text-anchor:middle;pointer-events:none}
.catlabel{font-size:var(--fc,12px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-anchor:middle;pointer-events:none;opacity:.55}
main{position:relative;overflow:hidden}
#detail{position:absolute;right:0;top:0;bottom:0;width:min(340px,92vw);z-index:3;border-left:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto;transform:translateX(102%);transition:transform .2s}
#detail.open{transform:none;box-shadow:-8px 0 24px #0006}
#detail .x{position:absolute;right:10px;top:8px;padding:2px 9px}
#detail h2{font-size:16px;margin:0 0 4px}
#detail .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin-right:4px;color:var(--mut)}
#detail p{margin:10px 0}
#detail .kv{color:var(--mut);font-size:12px}
#detail a{color:var(--acc);word-break:break-word}
#detail ul{padding-left:18px;margin:6px 0}
#detail li{margin:3px 0}
#detail li.lnk{cursor:pointer;color:var(--acc)}
.hint{color:var(--mut);font-size:12px}
button{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
@media (max-width:900px){main{flex-direction:column}aside,#detail{width:auto;max-height:30vh;border:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="kpis" id="kpis"></div>
  <div class="termine" id="termine"></div>
</header>
<main>
  <aside>
    <h3>Suche</h3>
    <input type="search" id="q" placeholder="Knoten suchen">
    <h3>Kategorien</h3>
    <div id="cats"></div>
    <h3>Verlässlichkeit</h3>
    <label class="f"><input type="checkbox" data-v="belegt" checked><span class="ln"></span>belegt</label>
    <label class="f"><input type="checkbox" data-v="berichtet" checked><span class="ln d"></span>berichtet</label>
    <label class="f"><input type="checkbox" data-v="vermutet" checked><span class="ln p"></span>vermutet</label>
    <h3>Ansicht</h3>
    <button id="reset">Ansicht zurücksetzen</button>
    <p class="hint">Knoten ziehen, Hintergrund ziehen = verschieben, Mausrad = zoomen. Klick auf Knoten oder Linie öffnet Details und Quellen rechts.</p>
  </aside>
  <div id="stage"><svg id="svg"></svg></div>
  <div id="detail"></div>
</main>
<script>
const DATA = /*DATA*/null;
const CATS = {
  firma:['Firma','#6ea8fe'], eigentuemer:['Eigentümer','#f2b84b'], doppelt:['Eigentümer und Konkurrent','#ff8a5c'],
  management:['Management','#b794f6'], zukauf:['Zukäufe','#4fd1a5'], konsortium:['Partner und Konsortien','#38bdf8'], lieferant:['Lieferanten','#e879f9'],
  beteiligung:['Beteiligungen','#f472b6'], produkt:['Produkte','#a3e635'], kunde:['Kunden','#2dd4bf'],
  konkurrent:['Konkurrenten','#94a3b8'], risiko:['Risiken und Ereignisse','#f87171']
};
const VERL = {belegt:'', berichtet:'d', vermutet:'p'};
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const el = (n, a={}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

window.addEventListener('message', ev => { const d = ev.data || {}; if (d.theme) { if (d.theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = d.theme; } });
const IN_FRAME = window.parent !== window;
if (IN_FRAME) document.documentElement.classList.add('in-frame');
// Kopf
const F = DATA.firma;
document.title = 'Mindmap ' + F.name;
document.getElementById('title').textContent = F.name + ' (' + F.ticker + ', ' + F.boerse + ')';
document.getElementById('sub').textContent = 'Stand ' + F.stand + '. Keine Anlageberatung. Nur auf Zuruf erneuert.';
document.getElementById('kpis').innerHTML = F.kennzahlen.map(k => `<div class="kpi" title="${esc(k.hinweis||'')}"><b>${esc(k.v)}</b><span>${esc(k.k)}</span></div>`).join('');
document.getElementById('termine').innerHTML = '<b>Termine:</b> ' + F.termine.map(t => `${esc(t.d)}: ${esc(t.t)}`).join(' &nbsp;|&nbsp; ');

// Daten
const NETZ = !!DATA.netz;
const nodes = DATA.knoten.map(n => ({...n, x:0, y:0, vx:0, vy:0, r: n.kat==='firma'?(NETZ?26:30):9+n.w*2.6, fixed:false}));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = DATA.kanten.map((e,i) => ({...e, i, a:byId[e.von], b:byId[e.zu]}));
const catKeys = Object.keys(CATS).filter(k => k!=='firma' && nodes.some(n => n.kat===k));
const state = {cats:Object.fromEntries(catKeys.map(k=>[k,true])), verl:{belegt:true,berichtet:true,vermutet:true}, q:'', sel:null, selEdge:null};

// Anker pro Kategorie auf einem Ring
const R = 430, anchors = {};
const _r = svg.getBoundingClientRect(); const ASP = Math.min(1.35, Math.max(0.85, (_r.width || 1000) / (_r.height || 700)));
catKeys.forEach((k,i) => { const ang = -Math.PI/2 + i*2*Math.PI/catKeys.length; anchors[k] = {x:Math.cos(ang)*R*ASP, y:Math.sin(ang)*R*0.95}; });
anchors.firma = {x:0, y:0};
const hubs = nodes.filter(n => n.kat==='firma');
if (NETZ) hubs.forEach((h,i) => { const ang = -Math.PI/2 + i*2*Math.PI/hubs.length; h.anchor = {x:Math.cos(ang)*330*ASP, y:Math.sin(ang)*330}; });
nodes.forEach((n,i) => { const a = n.anchor || anchors[n.kat]; const t = i*2.399; n.x = a.x + Math.cos(t)*40*(1+ (i%5)/5); n.y = a.y + Math.sin(t)*40*(1+(i%5)/5); });

// Aufbau SVG
const root = el('g', {}, svg);
const gCat = el('g', {}, root), gEdge = el('g', {}, root), gLab = el('g', {}, root), gNode = el('g', {}, root);
catKeys.forEach(k => { const t = el('text', {class:'catlabel', fill:CATS[k][1]}, gCat); t.textContent = CATS[k][0]; t._k = k; });
edges.forEach(e => {
  e.g = el('g', {class:'edge '+VERL[e.verl]}, gEdge);
  e.line = el('line', {}, e.g); e.hit = el('line', {class:'hit'}, e.g);
  e.hit.addEventListener('click', ev => { ev.stopPropagation(); selectEdge(e); });
  e.lab = el('text', {class:'elabel'}, gLab); e.lab.style.display = 'none';
});
nodes.forEach(n => {
  n.g = el('g', {class:'node'}, gNode);
  n.c = el('circle', {r:n.r, fill:CATS[n.kat][1]}, n.g);
  n.t = el('text', {dy: n.r+12}, n.g); n.t.textContent = n.name;
  n.g.addEventListener('pointerdown', ev => startDrag(ev, n));
});

// Legende
const catsDiv = document.getElementById('cats');
catKeys.forEach(k => {
  const l = document.createElement('label'); l.className = 'f';
  l.innerHTML = `<input type="checkbox" checked data-k="${k}"><span class="dot" style="background:${CATS[k][1]}"></span>${CATS[k][0]}`;
  catsDiv.appendChild(l);
});
catsDiv.addEventListener('change', e => { state.cats[e.target.dataset.k] = e.target.checked; refresh(); });
document.querySelectorAll('input[data-v]').forEach(i => i.addEventListener('change', () => { state.verl[i.dataset.v] = i.checked; refresh(); }));
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); refresh(); });

// Sichtbarkeit
function visNode(n){ return n.kat==='firma' || state.cats[n.kat]; }
function visEdge(e){ return visNode(e.a) && visNode(e.b) && state.verl[e.verl]; }

// Physik
let alpha = 1;
function step(){
  const vis = nodes.filter(visNode);
  for (let i=0;i<vis.length;i++) for (let j=i+1;j<vis.length;j++){
    const a=vis[i], b=vis[j]; let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy+0.01, d=Math.sqrt(d2);
    const min = a.r+b.r+100; let f = 12000/d2; if (d<min) f += (min-d)*0.5;
    dx/=d; dy/=d; a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f;
  }
  edges.forEach(e => { if(!visEdge(e) || (!NETZ && (e.a.kat==='firma' || e.b.kat==='firma'))) return;
    let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, d=Math.sqrt(dx*dx+dy*dy)+0.01; const L = (NETZ?170:90)+ (e.a.r+e.b.r), k=(NETZ?0.02:0.01)*(d-L)/d;
    e.a.vx+=dx*k; e.a.vy+=dy*k; e.b.vx-=dx*k; e.b.vy-=dy*k; });
  vis.forEach(n => { const a = n.anchor || anchors[n.kat]; const g = n.kat==='firma'?0.08:(NETZ?0.004:0.03);
    n.vx += (a.x-n.x)*g; n.vy += (a.y-n.y)*g; n.vx*=0.82; n.vy*=0.82;
    if(!n.fixed){ n.x += n.vx*alpha; n.y += n.vy*alpha; } });
}
function draw(){
  nodes.forEach(n => { n.g.setAttribute('transform', `translate(${n.x},${n.y})`); });
  edges.forEach(e => { for (const l of [e.line,e.hit]){ l.setAttribute('x1',e.a.x); l.setAttribute('y1',e.a.y); l.setAttribute('x2',e.b.x); l.setAttribute('y2',e.b.y); }
    e.lab.setAttribute('x',(e.a.x+e.b.x)/2); e.lab.setAttribute('y',(e.a.y+e.b.y)/2-4); });
  gCat.childNodes.forEach(t => { const a=anchors[t._k]; const ns=nodes.filter(n=>n.kat===t._k&&visNode(n)); if(!ns.length){t.style.display='none';return;} t.style.display='';
    const cx=ns.reduce((s,n)=>s+n.x,0)/ns.length, cy=ns.reduce((s,n)=>s+n.y,0)/ns.length;
    const len=Math.hypot(cx,cy)||1, ux=cx/len, uy=cy/len; const ext=Math.max(...ns.map(n=>Math.hypot(n.x-cx,n.y-cy)+n.r))+34;
    t.setAttribute('x',cx+ux*ext*1.1); t.setAttribute('y',cy+uy*ext*0.8); });
}
function loop(){ if (alpha>0.02 || dragging){ step(); draw(); alpha*=0.992; if(dragging) alpha=Math.max(alpha,0.3);} requestAnimationFrame(loop); }
for (let i=0;i<500;i++) step(); alpha=0.6; draw();

// Ansicht
let view = {x:0,y:0,k:1};
function applyView(){ root.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
  const kk = Math.max(view.k, 0.35); svg.style.setProperty('--fs', Math.min(26, 13/kk*0.92) + 'px'); svg.style.setProperty('--fc', Math.min(22, 12/kk*0.9) + 'px'); }
function fit(){ const r = svg.getBoundingClientRect(); const vis=nodes.filter(visNode);
  const x0=Math.min(...vis.map(n=>n.x-n.r)), x1=Math.max(...vis.map(n=>n.x+n.r)), y0=Math.min(...vis.map(n=>n.y-n.r))-30, y1=Math.max(...vis.map(n=>n.y+n.r))+30;
  const k = Math.min(r.width/(x1-x0+160), r.height/(y1-y0+60), 1.3); view.k=k; view.x=r.width/2-k*(x0+x1)/2; view.y=r.height/2-k*(y0+y1)/2; applyView(); }
document.getElementById('reset').onclick = () => { state.sel=null; state.selEdge=null; document.getElementById('q').value=''; state.q=''; fit(); refresh(); showHint(); };
svg.addEventListener('wheel', ev => { ev.preventDefault(); const r=svg.getBoundingClientRect(); const mx=ev.clientX-r.left, my=ev.clientY-r.top;
  const f = ev.deltaY<0?1.12:1/1.12; const nk=Math.max(0.2,Math.min(4,view.k*f)); view.x=mx-(mx-view.x)*nk/view.k; view.y=my-(my-view.y)*nk/view.k; view.k=nk; applyView(); }, {passive:false});
let panning=null, dragging=null, moved=false;
svg.addEventListener('pointerdown', ev => { if (ev.target!==svg) return; panning={x:ev.clientX-view.x,y:ev.clientY-view.y}; moved=false; svg.classList.add('pan'); svg.setPointerCapture(ev.pointerId); });
function startDrag(ev,n){ ev.stopPropagation(); dragging=n; n.fixed=true; moved=false; svg.setPointerCapture(ev.pointerId); }
svg.addEventListener('pointermove', ev => {
  if (panning){ view.x=ev.clientX-panning.x; view.y=ev.clientY-panning.y; moved=true; applyView(); }
  else if (dragging){ const r=svg.getBoundingClientRect(); dragging.x=(ev.clientX-r.left-view.x)/view.k; dragging.y=(ev.clientY-r.top-view.y)/view.k; moved=true; alpha=Math.max(alpha,0.3); }
});
svg.addEventListener('pointerup', ev => {
  if (panning){ panning=null; svg.classList.remove('pan'); if(!moved){ state.sel=null; state.selEdge=null; showHint(); refresh(); } }
  if (dragging){ const n=dragging; dragging=null; n.fixed=false; if(!moved) select(n); }
});

// Auswahl und Darstellung
function neighbors(n){ const s=new Set([n.id]); edges.forEach(e=>{ if(!visEdge(e)) return; if(e.a===n) s.add(e.b.id); if(e.b===n) s.add(e.a.id); }); return s; }
function refresh(){
  const nb = state.sel ? neighbors(state.sel) : null;
  nodes.forEach(n => {
    const v = visNode(n); n.g.style.display = v ? '' : 'none';
    let dim = false;
    if (nb && !nb.has(n.id)) dim = true;
    if (state.selEdge && state.selEdge.a!==n && state.selEdge.b!==n) dim = true;
    if (state.q && !(n.name+' '+n.text).toLowerCase().includes(state.q)) dim = true;
    n.g.classList.toggle('dim', dim); n.g.classList.toggle('sel', n===state.sel);
  });
  edges.forEach(e => {
    const v = visEdge(e); e.g.style.display = v ? '' : 'none';
    const on = state.sel && (e.a===state.sel || e.b===state.sel);
    const onE = state.selEdge===e;
    e.g.classList.toggle('hl', !!(on||onE));
    e.g.classList.toggle('dim', !!((state.sel && !on) || (state.selEdge && !onE)));
    e.lab.style.display = (v && (on||onE)) ? '' : 'none'; e.lab.textContent = e.label + (e.betrag? ' ('+e.betrag+')':'');
  });
  alpha = Math.max(alpha,0.35); draw();
}
function srcList(q){ return q && q.length ? '<ul>'+q.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.titel)}</a></li>`).join('')+'</ul>' : '<p class="hint">Keine Quelle (Einordnung).</p>'; }
function showHint(){ document.getElementById('detail').classList.remove('open'); }
function addClose(d){ const b = document.createElement('button'); b.className = 'x'; b.textContent = '×'; b.title = 'Schliessen'; b.onclick = () => { state.sel = null; state.selEdge = null; showHint(); refresh(); }; d.appendChild(b); d.classList.add('open'); }
function select(n){ state.sel=n; state.selEdge=null; refresh();
  const conn = edges.filter(e=>visEdge(e)&&(e.a===n||e.b===n)).map(e=>{ const o=e.a===n?e.b:e.a; return `<li class="lnk" data-id="${o.id}">${esc(o.name)}: ${esc(e.label)}${e.betrag?' ('+esc(e.betrag)+')':''}</li>`; }).join('');
  const d = document.getElementById('detail');
  d.innerHTML = `<h2>${esc(n.name)}</h2><span class="badge" style="border-color:${CATS[n.kat][1]};color:${CATS[n.kat][1]}">${CATS[n.kat][0]}</span><span class="badge">${esc(n.verl)}</span>
    <p>${esc(n.text)}</p>${n.betrag?`<div class="kv">Betrag: <b>${esc(n.betrag)}</b></div>`:''}${n.datum?`<div class="kv">Datum / Stand: ${esc(n.datum)}</div>`:''}
    ${(n.auch&&n.auch.length)?`<p class="kv">Auch in den Dossiers: ${n.auch.map(t=>IN_FRAME?`<button data-go="${esc(t)}">${esc(t)}</button>`:esc(t)).join(' ')}</p>`:''}${n.dossier?(IN_FRAME?`<p><button data-go="${esc(n.dossier)}">Dossier ${esc(n.dossier)} öffnen</button></p>`:`<p class="hint">Eigenes Dossier vorhanden: ${esc(n.dossier)}</p>`):''}<h3 class="hint">Verbindungen</h3><ul>${conn}</ul><h3 class="hint">Quellen</h3>${srcList(n.quellen)}`;
  d.querySelectorAll('li.lnk').forEach(li => li.onclick = () => select(byId[li.dataset.id]));
  d.querySelectorAll('button[data-go]').forEach(b => b.onclick = () => window.parent.postMessage({go:b.dataset.go}, '*'));
  addClose(d);
}
function selectEdge(e){ state.sel=null; state.selEdge=e; refresh();
  const d = document.getElementById('detail');
  d.innerHTML = `<h2>${esc(e.a.name)} und ${esc(e.b.name)}</h2><span class="badge">${esc(e.verl)}</span><p>${esc(e.label)}</p>${e.betrag?`<div class="kv">Betrag: <b>${esc(e.betrag)}</b></div>`:''}<h3 class="hint">Quellen</h3>${srcList(e.quellen)}`;
  addClose(d);
}
window.addEventListener('resize', fit);
fit(); refresh(); requestAnimationFrame(loop);
</script>
</body>
</html>
